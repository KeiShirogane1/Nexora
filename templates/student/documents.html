<!DOCTYPE html>
<html>
<head>
    <title>Document Upload - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #f5f5f5; margin: 0; padding: 0; padding-top: 80px;" class="content-page">

    {% include 'components/navbar.html' %}

    <div class="container mt-5">
        <h2>Document Upload</h2>

        <div class="card p-4 mb-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">Select File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>
        </div>

        <h3>Your Documents</h3>
        {% if docs %}
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Filename</th>
                            <th>Uploaded At</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for doc in docs %}
                            <tr>
                                <td>{{ doc[1] }}</td>
                                <td><small class="text-muted">{{ doc[2] }}</small></td>
                                <td>
                                    <a href="/student/document/{{ doc[0] }}" class="btn btn-info btn-sm" target="_blank">View</a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% else %}
            <p class="text-muted">No documents uploaded yet.</p>
        {% endif %}
    </div>

</body>
</html>
