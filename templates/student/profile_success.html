<!DOCTYPE html>
<html>

<head>

<title>Profile Completed - Nexora</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


<style>

body {

    height:100vh;
    margin:0;

    background:rgba(0,0,0,0.6);

    display:flex;
    justify-content:center;
    align-items:center;

}


.success-modal {


    width:450px;

    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.3);

}



.check {


    font-size:70px;

    color:#16a34a;

}



h2 {

    color:#111827;

    margin-bottom:15px;

}



p {

    color:#4b5563;

    font-size:16px;

}



button {


    margin-top:25px;

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-weight:600;

    cursor:pointer;

}


button:hover {

    background:#1d4ed8;

}


</style>

</head>



<body>


<div class="success-modal">


<div class="check">

✓

</div>


<h2>

Profile Completed Successfully!

</h2>


<p>

Your Nexora student profile has been created.

You may now continue to your dashboard.

</p>



<a href="/student/dashboard">

<button>

Continue

</button>

</a>


</div>


</body>


</html>
