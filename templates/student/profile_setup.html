<!DOCTYPE html>
<html>

<head>

<title>
Complete Student Profile - Nexora
</title>


<link 
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">


<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:rgba(0,0,0,0.65);

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:"Segoe UI", Arial, sans-serif;

    overflow-y:auto;

}


.profile-modal{

    width:500px;

    max-width:90%;

    background:white;

    padding:35px;

    border-radius:20px;

    margin:40px 0;

    box-shadow:
    0 20px 50px rgba(0,0,0,.3);

}



.profile-modal h2{

    text-align:center;

    font-size:30px;

    font-weight:700;

    color:#111827;

    margin-bottom:10px;

}



.progress{

    text-align:center;

    color:#2563eb;

    font-weight:700;

    margin-bottom:25px;

}



.step{

    display:none;

}



.step.active{

    display:block;

}



h3{

    font-size:20px;

    color:#111827;

    margin-bottom:20px;

}



input,
textarea{


    width:100%;


    padding:13px;


    margin-bottom:15px;


    border-radius:10px;


    border:1px solid #d1d5db;


    font-size:15px;


}



textarea{

    height:100px;

    resize:none;

}



button{


    width:100%;


    padding:13px;


    margin-top:10px;


    border:none;


    border-radius:10px;


    background:#2563eb;


    color:white;


    font-size:16px;


    font-weight:700;


    cursor:pointer;


    transition:.2s;


}


button:hover{

    background:#1d4ed8;

}


button:disabled{

    cursor:not-allowed;

}



.back{

    background:#6b7280;

}


.back:hover{

    background:#4b5563;

}



/* ERROR COLORS */


.input-error{

    border:2px solid #dc2626 !important;

    background:#fee2e2;

}


.input-error::placeholder{

    color:#dc2626;

}



.input-success{

    border:2px solid #16a34a !important;

}



/* UPLOAD */


.upload{


    width:100%;


    height:55px;


    display:flex;


    justify-content:center;


    align-items:center;


    border-radius:10px;


    border:2px dashed #2563eb;


    background:#f8fafc;


    color:#2563eb;


    font-weight:600;


    cursor:pointer;


}


.upload input{

    display:none;

}



/* CROPPER */


.crop-wrapper{


    display:none;


    width:250px;


    height:250px;


    margin:20px auto;


    overflow:hidden;


}


.crop-wrapper.active{

    display:block;

}



#preview{


    width:250px;


    height:250px;


}



.crop-buttons{


    display:none;


    gap:15px;


    margin-bottom:15px;


}


.crop-buttons button{

    width:50%;

}





</style>


</head>


<body>


<div class="profile-modal">



<h2>
Complete Your Student Profile
</h2>


<div class="progress">

Step <span id="number">1</span> of 3

</div>



<form method="POST"
enctype="multipart/form-data">

<input 
type="hidden"
name="cropped_image"
id="croppedImage">

<!-- STEP 1 -->


<div class="step active">


<h3>
Basic Information
</h3>


<input
name="first_name"
placeholder="First Name">


<input
name="middle_name"
placeholder="Middle Name">


<input
name="last_name"
placeholder="Last Name">


<input
type="number"
name="age"
placeholder="Age">


<input
id="student_id"
name="student_id"
placeholder="Student ID">



<label class="upload">


📷 Upload Profile Picture


<input
type="file"
name="profile_picture"
accept="image/*"
onchange="loadImage(event)">


</label>



<div class="crop-wrapper">


<img id="preview">


</div>



<div
id="cropButtons"
class="crop-buttons">


<button
type="button"
onclick="zoomIn()">

Zoom +

</button>


<button
type="button"
onclick="zoomOut()">

Zoom -

</button>


</div>




<button
type="button"
onclick="validateStep1()">

Next →

</button>



</div>

<!-- STEP 2 -->

<div class="step">


<h3>
Contact Information
</h3>


<input
name="phone_number"
placeholder="09XXXXXXXXX"
maxlength="11">


<textarea
name="home_address"
placeholder="House Number, Street, Barangay, City/Municipality, Province">
</textarea>



<button
type="button"
class="back"
onclick="previousStep()">

← Back

</button>



<button
type="button"
onclick="validateStep2()">

Next →

</button>



</div>





<!-- STEP 3 -->


<div class="step">


<h3>
Class Information
</h3>



<input
name="grade_year"
placeholder="Example: 4th Year / Grade 12">



<input
name="major_program"
placeholder="Example: Bachelor of Science in Information Technology">





<button
type="button"
class="back"
onclick="previousStep()">

← Back

</button>




<button
type="button"
onclick="validateStep3()">

Complete Profile

</button>



</div>


</form>


</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>



<script>


let currentStep = 0;


const steps =
document.querySelectorAll(".step");


const number =
document.getElementById("number");



/* ==========================
   FIELD ERROR HANDLING
========================== */


function checkField(input){


    if(input.value.trim() === ""){


        input.classList.add(
            "input-error"
        );


        input.classList.remove(
            "input-success"
        );


        return false;


    }



    input.classList.remove(
        "input-error"
    );


    input.classList.add(
        "input-success"
    );


    return true;


}




// remove red while typing

document
.querySelectorAll("input, textarea")
.forEach(function(input){


    input.addEventListener(
        "input",
        function(){


            if(this.value.trim() !== ""){


                this.classList.remove(
                    "input-error"
                );


                this.classList.add(
                    "input-success"
                );


            }


        }
    );


});





/* ==========================
   STEP 1 VALIDATION
========================== */


function validateStep1(){


    let fields = [

        "first_name",
        "middle_name",
        "last_name",
        "age",
        "student_id"

    ];



    let valid = true;



    fields.forEach(function(field){


        let input =
        document.querySelector(
            `input[name="${field}"]`
        );



        if(!checkField(input)){


            valid = false;


        }



    });



    if(valid){


        nextStep();


    }


}





/* ==========================
   STEP 2 VALIDATION
========================== */


function validateStep2(){


    let phone =
    document.querySelector(
        'input[name="phone_number"]'
    );


    let address =
    document.querySelector(
        'textarea[name="home_address"]'
    );



    let valid = true;



    if(!checkField(phone)){

        valid=false;

    }



    if(!checkField(address)){

        valid=false;

    }




    if(
        phone.value.trim() !== "" &&
        phone.value.length !== 11
    ){


        phone.classList.add(
            "input-error"
        );


        phone.classList.remove(
            "input-success"
        );


        valid=false;


    }





    if(valid){


        nextStep();


    }



}





/* ==========================
   STEP 3 VALIDATION
========================== */


function validateStep3(){


    let year =
    document.querySelector(
        'input[name="grade_year"]'
    );



    let program =
    document.querySelector(
        'input[name="major_program"]'
    );



    let valid=true;



    if(!checkField(year)){


        valid=false;


    }



    if(!checkField(program)){


        valid=false;


    }




    if(valid){


    if(cropper){

        let canvas = cropper.getCroppedCanvas({
            width:400,
            height:400
        });


        document.getElementById(
            "croppedImage"
        ).value =
        canvas.toDataURL("image/jpeg");


    }


    document
    .querySelector("form")
    .submit();


}


}






/* ==========================
   STEP CONTROL
========================== */


function nextStep(){


    if(currentStep < steps.length-1){


        steps[currentStep]
        .classList.remove("active");



        currentStep++;



        steps[currentStep]
        .classList.add("active");



        number.innerHTML =
        currentStep + 1;



    }


}





function previousStep(){


    if(currentStep > 0){


        steps[currentStep]
        .classList.remove("active");



        currentStep--;



        steps[currentStep]
        .classList.add("active");



        number.innerHTML =
        currentStep + 1;


    }


}





/* ==========================
   CROPPER
========================== */


let cropper;



function loadImage(event){


    let image =
    document.getElementById(
        "preview"
    );



    let wrapper =
    document.querySelector(
        ".crop-wrapper"
    );



    let buttons =
    document.getElementById(
        "cropButtons"
    );



    image.src =
    URL.createObjectURL(
        event.target.files[0]
    );



    wrapper.classList.add(
        "active"
    );



    buttons.style.display =
    "flex";



    if(cropper){


        cropper.destroy();


    }



    cropper =
    new Cropper(
        image,
        {

            aspectRatio:1,

            viewMode:1,

            dragMode:"move",

            autoCropArea:.8,

            movable:true,

            zoomable:true,

            background:false


        }
    );


}





function zoomIn(){


    if(cropper){


        cropper.zoom(
            0.1
        );


    }


}




function zoomOut(){


    if(cropper){


        cropper.zoom(
            -0.1
        );


    }


}



</script>


</body>

</html>
