<!DOCTYPE html>
<html>
<head>
    <title>Edit Log - Nexora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="content-page">

{% include 'components/navbar.html' %}

<div class="container mt-5" style="max-width: 800px;">

    <div class="alert alert-warning">
        You may edit this log only while today's internship session is still open.
    </div>
    
    <div class="card">

        <div class="card-header bg-warning">
            <h4 class="mb-0">
                ✏️ Edit Log Entry
            </h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Log Entry
                    </label>

                    <textarea
                        class="form-control"
                        name="content"
                        rows="8"
                        required>{{ log[1] }}</textarea>

                </div>

                <button
                    class="btn btn-primary"
                    type="submit">

                    Save Changes

                </button>

                <a
                    href="/student/logbook"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
