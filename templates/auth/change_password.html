<!DOCTYPE html>
<html>
<head>
    <title>Change Password - Nexora</title>
</head>

<body>

    <h2>Change Password</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="password"
            name="current_password"
            placeholder="Current Password"
            required
        >

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            required
        >

        <button type="submit">
            Change Password
        </button>

    </form>

</body>
</html>
