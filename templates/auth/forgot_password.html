<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Nexora</title>
</head>

<body>

    <h2>Forgot Password</h2>

    <p>
        Enter the email address associated
        with your Nexora account.
    </p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a href="{{ url_for('auth.login') }}">
        Back to Login
    </a>

</body>
</html>
