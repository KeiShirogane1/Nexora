<!DOCTYPE html>
<html>
<head>
    <title>Nexora Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body background="/static/images/Nexora Login.png">

    <div class="login-container">
        <h2>Nexora Login</h2>

        <form method="POST">
            {% if error %}
            <div style="margin: 12px 0; padding: 10px; background: #ffe5e5; color: #b00020; border-radius: 6px; text-align: center;">
                {{ error }}
            </div>
            {% endif %}
            <input
                type="text"
                name="username"
                placeholder="Username"
                value="{{ entered_username or '' }}"
                required
            >            
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p class="signup-link">Don't have an account? <a href="/signup">Sign Up</a></p>
        </form>
    </div>

</body>
</html>
