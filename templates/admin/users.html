<!DOCTYPE html>
<html>
<head>
    <title>User Management - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="executive_aesthetic">

    {% include 'components/admin_navbar.html' %}
    {% include 'components/admin_sidebar.html' %}

    <div class="page-content">
    <div class="container mt-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 style="color: white">User Management</h1>
                <p style="color: white">View all registered users and their roles.</p>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-5">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for user in users %}
                            <tr>
                                <td>{{ user[0] }}</td>
                                <td>{{ user[1] }}</td>
                                <td>
                                    <span class="badge bg-{{ 'success' if user[2]=='student' else 'warning' if user[2]=='supervisor' else 'danger' }} text-capitalize">
                                        {{ user[2] }}
                                    </span>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    </div>

        <!-- sidebar script ^^ -->
        <script>

        const sidebarToggle =
            document.getElementById("adminSidebarToggle");

        const sidebar =
            document.querySelector(".admin-sidebar");

        const pageContent =
            document.querySelector(".page-content");


        sidebarToggle.addEventListener("click", function () {

            sidebar.classList.toggle("active");

           pageContent.classList.toggle("sidebar-open");

        });

        </script>
</body>
</html>
