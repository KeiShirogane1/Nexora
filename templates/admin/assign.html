<!DOCTYPE html>
<html>
<head>
    <title>Assign Students - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="executive_aesthetic">

    {% include 'components/admin_navbar_legacy.html' %}

    <div class="container mt-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 style="color: white">Assign Students</h1>
                <p style="color: white">Link students with supervisors quickly and safely.</p>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Student</label>
                            <select class="form-select" name="student_id" required>
                                {% for s in students %}
                                    <option value="{{ s[0] }}">{{ s[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Supervisor</label>
                            <select class="form-select" name="supervisor_id" required>
                                {% for sup in supervisors %}
                                    <option value="{{ sup[0] }}">{{ sup[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button class="btn btn-primary" type="submit">Assign</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Student</th>
                                <th>Supervisor</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for a in assignments %}
                            <tr>
                                <td>{{ a[1] }}</td>
                                <td>{{ a[3] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
