    <!-- HEADER -->

    <div class="sidebar-header">

        </button>



        <div class="sidebar-brand">


            <img

            <h3>
                Nexora

        </div>


    </div>





    <!-- PROFILE -->


    <div class="sidebar-profile">


        {% if profile and profile[5] %}


        <img

        class="sidebar-avatar">


        {% else %}


        <img
        src="{{ url_for('static', filename='images/default_profile.png') }}"
        class="sidebar-avatar">


        {% endif %}




        <h4>

            {{ profile[0] if profile else "Student" }}

            {{ profile[2] if profile else "" }}

        </h4>



        <p>
            Student

    </div>
