<!DOCTYPE html>
<html>
<head>
    <title>Supervisor Dashboard - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="work-page">

    {% include 'components/supervisor_navbar.html' %}

    {% include 'components/supervisor_sidebar.html' %}

    <div class="page-content">
    <div class="container mt-5">

        <h2>Assigned Students</h2>

        {% if students %}
            <div class="card p-4">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Student Name</th>
                            <th scope="col" class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                            <tr>
                                <td>{{ student[1] }}</td>
                                <td class="text-end">
                                    <a href="/supervisor/student/{{ student[0] }}" class="btn btn-sm btn-primary">
                                        View
                                    </a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% else %}
            <div class="card p-4">
                <p class="text-muted">No assigned students yet.</p>
            </div>
        {% endif %}
    </div>
    </div>

    <!-- SIDEBAR SCRIPT -->

    <script>

        const sidebarToggle =
            document.getElementById("sidebarToggle");

        const sidebar =
            document.querySelector(".supervisor-sidebar");

        sidebarToggle.addEventListener("click", function () {


            const pageContent =
                document.querySelector(".page-content");


            sidebar.classList.toggle("active");

            pageContent.classList.toggle("sidebar-open");


        });

    </script>

</body>
</html>
