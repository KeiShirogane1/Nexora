<!DOCTYPE html>
<html>

<head>

    <title>Edit Task - Nexora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="work-page">


    {% include 'components/supervisor_navbar.html' %}



    <div class="container mt-5">


        <!-- PAGE HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">


            <div>

                <h1>
                    Edit Task
                </h1>


                <p class="text-muted mb-0">

                    Update the details of this internship task.

                </p>

            </div>



            <a href="/supervisor/task/{{ task_id }}"
               class="btn btn-secondary">

                ← Back to Task

            </a>


        </div>




        <!-- EDIT TASK CARD -->

        <div class="card shadow-sm">


            <div class="card-body">


                <form method="POST">


                    <!-- TASK TITLE -->

                    <div class="mb-3">


                        <label class="form-label">

                            Task Title

                        </label>



                        <input

                            type="text"

                            class="form-control"

                            name="task_title"

                            value="{{ task[2] }}"

                            required>


                    </div>




                    <!-- DESCRIPTION -->

                    <div class="mb-3">


                        <label class="form-label">

                            Task Description

                        </label>



                        <textarea

                            class="form-control"

                            name="task_description"

                            rows="6"

                            required>{{ task[3] }}</textarea>


                    </div>




                    <!-- DEADLINE -->

                    <div class="mb-4">


                        <label class="form-label">

                            Deadline

                        </label>



                        <input

                            type="datetime-local"

                            class="form-control"

                            name="deadline"

                            value="{{ task[4] or '' }}">


                    </div>




                    <hr>




                    <!-- SUBMISSION SETTINGS -->

                    <h5 class="mb-3">

                        Submission Settings

                    </h5>




                    <!-- REQUIRE SUBMISSION -->

                    <div class="form-check mb-2">


                        <input

                            class="form-check-input"

                            type="checkbox"

                            id="requires_submission"

                            name="requires_submission"

                            {% if task[5] == 1 %}

                                checked

                            {% endif %}>


                        <label

                            class="form-check-label"

                            for="requires_submission">


                            Requires File Submission


                        </label>


                    </div>




                    <!-- ALLOW LATE SUBMISSION -->

                    <div class="form-check mb-4">


                        <input

                            class="form-check-input"

                            type="checkbox"

                            id="allow_late_submission"

                            name="allow_late_submission"

                            {% if task[6] == 1 %}

                                checked

                            {% endif %}>


                        <label

                            class="form-check-label"

                            for="allow_late_submission">


                            Allow Late Submission


                        </label>


                    </div>




                    <hr>




                    <!-- ACTIONS -->

                    <div class="d-flex gap-2">


                        <button

                            type="submit"

                            class="btn btn-success">


                            Save Changes


                        </button>



                        <a

                            href="/supervisor/task/{{ task_id }}"

                            class="btn btn-outline-secondary">


                            Cancel


                        </a>


                    </div>


                </form>


            </div>


        </div>


    </div>


</body>

</html>
