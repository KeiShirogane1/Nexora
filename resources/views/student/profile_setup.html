<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Complete Student Profile - Nexora</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
        <style>
            body {
                min-height: 100vh;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #dbeafe);
                color: #0f172a;
                font-family: Arial, Helvetica, sans-serif;
            }
            .profile-modal {
                width: min(680px, 100%);
                margin: 0 auto;
                padding: 36px;
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 20px;
                box-shadow: 0 20px 55px rgba(15, 23, 42, 0.12);
            }
            .profile-modal h2 {
                margin: 0;
                font-size: 2rem;
                font-weight: 800;
                color: #0f172a;
            }
            .progress {
                margin: 8px 0 28px;
                color: #64748b;
                font-size: 0.9rem;
                font-weight: 600;
            }
            .step {
                display: none;
            }
            .step.active {
                display: block;
            }
            .step h3 {
                margin: 0 0 18px;
                color: #0f172a;
                font-size: 1.15rem;
                font-weight: 800;
            }
            .step > input,
            .step > textarea {
                display: block;
                width: 100%;
                min-height: 44px;
                margin: 0 0 12px;
                padding: 11px 13px;
                box-sizing: border-box;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                background: #fff;
                color: #0f172a;
                font: inherit;
            }
            .step > textarea {
                min-height: 120px;
                resize: vertical;
            }
            .step > input:focus,
            .step > textarea:focus {
                outline: none;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }
            .upload {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 14px 0;
                padding: 13px 15px;
                border: 1px dashed #94a3b8;
                border-radius: 10px;
                background: #f8fafc;
                color: #334155;
                font-weight: 700;
                cursor: pointer;
            }
            .upload input[type="file"] {
                flex: 1;
                min-width: 0;
            }
            .crop-wrapper {
                display: none;
                margin: 14px 0;
                padding: 12px;
                border: 1px solid #e2e8f0;
                border-radius: 14px;
                background: #f8fafc;
                overflow: hidden;
            }
            .crop-wrapper.active {
                display: block;
            }
            .crop-wrapper img {
                display: block;
                width: 100%;
                max-height: 360px;
            }
            .crop-buttons {
                display: none;
                gap: 10px;
                margin: 10px 0 14px;
            }
            .crop-buttons button,
            .step > button {
                min-height: 42px;
                padding: 10px 16px;
                border: 0;
                border-radius: 10px;
                background: #2563eb;
                color: #fff;
                font: inherit;
                font-weight: 700;
                cursor: pointer;
            }
            .crop-buttons button {
                background: #eff6ff;
                color: #1d4ed8;
                border: 1px solid #bfdbfe;
            }
            .crop-buttons button:hover,
            .step > button:hover {
                filter: brightness(0.96);
            }
            .step > button:not(.back) {
                width: 100%;
                margin-top: 6px;
            }
            .step > button.back {
                margin-right: 8px;
                background: #fff;
                color: #334155;
                border: 1px solid #cbd5e1;
            }
            .input-error {
                border-color: #ef4444 !important;
                background: #fff7f7 !important;
            }
            .input-success {
                border-color: #22c55e !important;
            }
            .image-error {
                display: none;
                margin: 8px 0 12px;
                padding: 10px 12px;
                border: 1px solid #fecaca;
                border-radius: 8px;
                background: #fef2f2;
                color: #dc2626;
                font-size: 0.85rem;
                font-weight: 600;
                line-height: 1.4;
            }
            .image-error.show {
                display: block;
            }
            @media (max-width: 700px) {
                body {
                    padding: 20px 12px;
                }
                .profile-modal {
                    padding: 24px 18px;
                    border-radius: 16px;
                }
                .profile-modal h2 {
                    font-size: 1.55rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="profile-modal">
            <h2>Complete Your Student Profile</h2>
            <div class="progress">Step <span id="number">1</span> of 3</div>
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="cropped_image" id="croppedImage">

                <div class="step active">
                    <h3>Basic Information</h3>
                    <input name="first_name" placeholder="First Name">
                    <input name="middle_name" placeholder="Middle Name">
                    <input name="last_name" placeholder="Last Name">
                    <input type="number" name="age" placeholder="Age">
                    <input id="student_id" name="student_id" placeholder="Student ID">
                    <label class="upload">
                        📷 Upload Profile Picture
                        <input type="file" name="profile_picture" accept="image/*" onchange="loadImage(event)">
                    </label>
                    <div class="crop-wrapper">
                        <img id="preview" alt="Profile preview">
                    </div>
                    <div id="cropButtons" class="crop-buttons">
                        <button type="button" onclick="zoomIn()">Zoom +</button>
                        <button type="button" onclick="zoomOut()">Zoom -</button>
                    </div>
                    <div id="imageError" class="image-error" style="display:none;" role="alert"></div>
                    <button type="button" onclick="validateStep1()">Next →</button>
                </div>

                <div class="step">
                    <h3>Contact Information</h3>
                    <input name="phone_number" placeholder="09XXXXXXXXX" maxlength="11">
                    <textarea name="home_address" placeholder="House Number, Street, Barangay, City/Municipality, Province"></textarea>
                    <button type="button" class="back" onclick="previousStep()">← Back</button>
                    <button type="button" onclick="validateStep2()">Next →</button>
                </div>

                <div class="step">
                    <h3>Class Information</h3>
                    <input name="grade_year" placeholder="Example: 4th Year / Grade 12">
                    <input name="major_program" placeholder="Example: Bachelor of Science in Information Technology">
                    <button type="button" class="back" onclick="previousStep()">← Back</button>
                    <button type="button" onclick="validateStep3()">Complete Profile</button>
                </div>
            </form>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
        <script>
            let currentStep = 0;
            let cropper = null;
            let currentObjectUrl = null;
            let cropperReady = false;
            let imageSelected = false;
            let imageLoadPending = false;
            const steps = document.querySelectorAll(".step");
            const number = document.getElementById("number");

            function showImageError(msg) {
                const el = document.getElementById("imageError");
                if (!el) return;
                el.textContent = msg;
                el.style.display = "block";
                el.classList.add("show");
            }
            function clearImageError() {
                const el = document.getElementById("imageError");
                if (!el) return;
                el.textContent = "";
                el.style.display = "none";
                el.classList.remove("show");
            }
            function resetCropperState() {
                if (cropper) {
                    try {
                        cropper.destroy();
                    } catch (e) {}
                }
                cropper = null;
                cropperReady = false;
                imageLoadPending = false;
            }

            function checkField(input) {
                if (!input || input.value.trim() === "") {
                    if (input) {
                        input.classList.add("input-error");
                        input.classList.remove("input-success");
                    }
                    return false;
                }
                input.classList.remove("input-error");
                input.classList.add("input-success");
                return true;
            }

            document.querySelectorAll("input, textarea").forEach((input) => {
                input.addEventListener("input", function () {
                    if (this.value.trim() !== "") {
                        this.classList.remove("input-error");
                        this.classList.add("input-success");
                    }
                });
            });

            function validateStep1() {
                const fields = ["first_name", "middle_name", "last_name", "age", "student_id"];
                const valid = fields.every((field) => checkField(document.querySelector(`input[name="${field}"]`)));
                if (valid) nextStep();
            }

            function validateStep2() {
                const phone = document.querySelector('input[name="phone_number"]');
                const address = document.querySelector('textarea[name="home_address"]');
                let valid = checkField(phone) && checkField(address);
                if (phone.value.trim() !== "" && phone.value.length !== 11) {
                    phone.classList.add("input-error");
                    phone.classList.remove("input-success");
                    valid = false;
                }
                if (valid) nextStep();
            }

            function validateStep3() {
                const year = document.querySelector('input[name="grade_year"]');
                const program = document.querySelector('input[name="major_program"]');
                const valid = checkField(year) && checkField(program);
                if (!valid) return;
                const fileInput = document.querySelector('input[type="file"][name="profile_picture"]');
                const hasFile = fileInput && fileInput.files && fileInput.files.length > 0;
                if (hasFile && (imageLoadPending || !cropperReady)) {
                    showImageError("Image is still loading. Please wait for the crop box to appear before completing your profile.");
                    return;
                }
                if (hasFile && imageSelected && !cropper) {
                    showImageError("Image failed to load. Please select a valid image or remove it before completing your profile.");
                    return;
                }
                if (cropper && cropperReady) {
                    try {
                        document.getElementById("croppedImage").value = cropper.getCroppedCanvas({ width: 400, height: 400 }).toDataURL("image/jpeg");
                    } catch (e) {
                        showImageError("Failed to process image. Please try a different image.");
                        return;
                    }
                }
                document.querySelector("form").submit();
            }

            function nextStep() {
                if (currentStep >= steps.length - 1) return;
                steps[currentStep].classList.remove("active");
                currentStep += 1;
                steps[currentStep].classList.add("active");
                number.textContent = currentStep + 1;
            }

            function previousStep() {
                if (currentStep <= 0) return;
                steps[currentStep].classList.remove("active");
                currentStep -= 1;
                steps[currentStep].classList.add("active");
                number.textContent = currentStep + 1;
            }

            function loadImage(event) {
                const file = event.target.files && event.target.files[0];
                const image = document.getElementById("preview");
                const wrapper = document.querySelector(".crop-wrapper");
                const buttons = document.getElementById("cropButtons");
                clearImageError();
                if (!file) {
                    imageSelected = false;
                    imageLoadPending = false;
                    resetCropperState();
                    if (currentObjectUrl) {
                        try {
                            URL.revokeObjectURL(currentObjectUrl);
                        } catch (e) {}
                        currentObjectUrl = null;
                    }
                    try {
                        image.removeAttribute("src");
                    } catch (e) {}
                    if (wrapper) wrapper.classList.remove("active");
                    if (buttons) buttons.style.display = "none";
                    return;
                }
                const isImage = file.type ? file.type.startsWith("image/") : /\.(png|jpe?g|gif|webp|bmp)$/i.test(file.name);
                if (!isImage) {
                    imageSelected = false;
                    imageLoadPending = false;
                    resetCropperState();
                    if (currentObjectUrl) {
                        try {
                            URL.revokeObjectURL(currentObjectUrl);
                        } catch (e) {}
                        currentObjectUrl = null;
                    }
                    try {
                        image.removeAttribute("src");
                    } catch (e) {}
                    if (wrapper) wrapper.classList.remove("active");
                    if (buttons) buttons.style.display = "none";
                    showImageError("Invalid file. Please select a valid image (PNG, JPG, GIF).");
                    try {
                        event.target.value = "";
                    } catch (e) {}
                    return;
                }
                imageSelected = true;
                imageLoadPending = true;
                cropperReady = false;
                if (cropper) {
                    try {
                        cropper.destroy();
                    } catch (e) {}
                    cropper = null;
                }
                if (currentObjectUrl) {
                    try {
                        URL.revokeObjectURL(currentObjectUrl);
                    } catch (e) {}
                    currentObjectUrl = null;
                }
                if (wrapper) wrapper.classList.remove("active");
                if (buttons) buttons.style.display = "none";
                try {
                    currentObjectUrl = URL.createObjectURL(file);
                } catch (e) {
                    showImageError("Failed to load image. Please try again.");
                    imageSelected = false;
                    imageLoadPending = false;
                    return;
                }
                image.onload = function () {
                    if (typeof window.Cropper === "undefined") {
                        showImageError("Image cropping unavailable. Please refresh the page.");
                        imageLoadPending = false;
                        return;
                    }
                    try {
                        if (cropper) {
                            try {
                                cropper.destroy();
                            } catch (e2) {}
                            cropper = null;
                        }
                        cropper = new window.Cropper(image, {
                            aspectRatio: 1,
                            viewMode: 1,
                            dragMode: "move",
                            autoCropArea: 0.8,
                            movable: true,
                            zoomable: true,
                            background: false,
                        });
                        cropperReady = true;
                        imageLoadPending = false;
                        clearImageError();
                        if (wrapper) wrapper.classList.add("active");
                        if (buttons) buttons.style.display = "flex";
                    } catch (e) {
                        cropper = null;
                        cropperReady = false;
                        imageLoadPending = false;
                        if (wrapper) wrapper.classList.remove("active");
                        if (buttons) buttons.style.display = "none";
                        showImageError("Failed to initialize image editor. Please try a different image.");
                    }
                };
                image.onerror = function () {
                    resetCropperState();
                    if (currentObjectUrl) {
                        try {
                            URL.revokeObjectURL(currentObjectUrl);
                        } catch (e) {}
                        currentObjectUrl = null;
                    }
                    try {
                        image.removeAttribute("src");
                    } catch (e) {}
                    if (wrapper) wrapper.classList.remove("active");
                    if (buttons) buttons.style.display = "none";
                    showImageError("Failed to load image. The file may be corrupt or not a valid image.");
                    try {
                        event.target.value = "";
                    } catch (e) {}
                };
                image.src = currentObjectUrl;
            }

            function zoomIn() {
                if (cropper && cropperReady) cropper.zoom(0.1);
            }

            function zoomOut() {
                if (cropper && cropperReady) cropper.zoom(-0.1);
            }
        </script>
    </body>
</html>
