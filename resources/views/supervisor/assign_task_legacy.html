<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Assign Task - Nexora</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body class="content-page">

        {% include 'components/supervisor_sidebar.html' %}

        <div class="page-content">

            <div class="nexora-page">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h1>Assign Task</h1>
                        <p class="text-muted mb-0">
                            Create a new internship task for the assigned student.
                        </p>
                    </div>

                    <a href="/supervisor/student/{{ student_id }}" class="btn btn-secondary">
                        ← Back to Student
                    </a>

                </div>

                <div class="card shadow-sm">

                    <div class="card-body">

                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <!-- Task Title -->

                            <div class="mb-3">
                                <label class="form-label">
                                    Task Title
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="task_title"
                                    placeholder="e.g. Database Design Documentation"
                                    required>
                            </div>

                    <!-- Description -->

                            <div class="mb-3">
                                <label class="form-label">
                                    Task Description
                                </label>

                                <textarea
                                    class="form-control"
                                    name="task_description"
                                    rows="6"
                                    placeholder="Describe the task, objectives, and expected output..."
                                    required></textarea>
                            </div>

                    <!-- Deadline -->

                            <div class="mb-4">
                                <label class="form-label">
                                    Deadline (Optional)
                                </label>

                                <input
                                    type="datetime-local"
                                    class="form-control"
                                    name="deadline">
                            </div>

                            <hr>

                    <!-- Submission Settings -->

                            <h5 class="mb-3">
                                Submission Settings
                            </h5>

                            <div class="form-check mb-2">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="requires_submission"
                                    name="requires_submission"
                                    checked>

                                <label
                                    class="form-check-label"
                                    for="requires_submission">

                                    Requires File Submission

                                </label>

                            </div>

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="allow_late_submission"
                                    name="allow_late_submission">

                                <label
                                    class="form-check-label"
                                    for="allow_late_submission">

                                    Allow Late Submission

                                </label>

                            </div>

                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-success">

                                    Assign Task

                                </button>

                                <a
                                    href="/supervisor/student/{{ student_id }}"
                                    class="btn btn-outline-secondary">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </body>
</html>
