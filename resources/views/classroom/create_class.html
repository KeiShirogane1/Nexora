{% extends 'base.html' if false else 'supervisor/dashboard.html' %}
{% block content %}
<div class="container py-4" style="max-width:820px">
  <div class="mb-4"><h1>Create a Class</h1><p class="text-muted">Create a dedicated space for your interns, announcements, and classwork.</p></div>
  <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
    <form method="post" action="/supervisor/classes/create">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label fw-semibold">Class name</label><input class="form-control form-control-lg" name="name" maxlength="120" required placeholder="e.g. IT Internship — Web Development"></div>
      <div class="mb-3"><label class="form-label fw-semibold">Section</label><input class="form-control" name="section" maxlength="80" placeholder="e.g. BSIT 4A"></div>
      <div class="mb-4"><label class="form-label fw-semibold">Description</label><textarea class="form-control" name="description" rows="5" maxlength="1000" placeholder="What is this class for?"></textarea></div>
      <div class="d-flex gap-2"><a href="/supervisor/classes" class="btn btn-light">Cancel</a><button class="btn btn-primary px-4" type="submit">Create Class</button></div>
    </form>
  </div></div>
</div>
{% endblock %}
