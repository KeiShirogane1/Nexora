<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Create Class - Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/supervisor.css') }}">
    </head>
    <body class="analytics-aesthetic">
        {% include 'components/supervisor_sidebar.html' %}
        <div class="page-content nexora-app-main">
            <div class="nexora-page">
                <div class="nexora-page" style="max-width:720px; margin:0 auto;">
                    <a href="{{ url_for('classroom.supervisor_classes') }}" class="btn btn-light btn-sm mb-3">← Back to My Classes</a>
                    <div class="card shadow-sm">
                        <div class="card-header bg-white">
                            <h4 class="mb-0">Create Class</h4>
                            <small class="text-muted">Organize interns by class and section.</small>
                        </div>
                        <div class="card-body">
                            <form method="POST" novalidate>
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <div class="mb-3">
                                    <label for="class_name" class="form-label">Class name <span class="text-danger">*</span></label>
                                    <input type="text" id="class_name" name="class_name" class="form-control" placeholder="e.g., BSIT 3A - Internship 2026" value="{{ form.class_name if form.class_name else '' }}" required>
                                    {% if errors and errors.class_name %}<div class="text-danger small mt-1">{{ errors.class_name }}</div>{% endif %}
                                </div>
                                <div class="mb-3">
                                    <label for="section" class="form-label">Section <span class="text-danger">*</span></label>
                                    <input type="text" id="section" name="section" class="form-control" placeholder="e.g., BSIT 3A" value="{{ form.section if form.section else '' }}" required>
                                    {% if errors and errors.section %}<div class="text-danger small mt-1">{{ errors.section }}</div>{% endif %}
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea id="description" name="description" class="form-control" rows="3" placeholder="Optional description for this class">{{ form.description if form.description else '' }}</textarea>
                                </div>
                                <div class="d-flex gap-2 justify-content-end">
                                    <a href="{{ url_for('classroom.supervisor_classes') }}" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary">Create Class</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
