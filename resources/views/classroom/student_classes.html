{% set target_url = url_for('classroom.student_class', class_id=classes[0].id) if classes else url_for('classroom.join_class') %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url={{ target_url }}">
    <title>Opening Intern Classroom - Nexora</title>
    <script>
        window.location.replace({{ target_url|tojson }});
    </script>
</head>
<body>
    <noscript>
        <a href="{{ target_url }}">Continue to your Intern Classroom</a>
    </noscript>
</body>
</html>
