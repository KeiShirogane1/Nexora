<style id="nx-supervisor-document-styles">
body.supervisor-student-documents-page,
body.supervisor-student-document-folder-page {
    background: #f4f7fb !important;
    color: #17233b;
}
body.supervisor-student-documents-page .supervisor-documents-page,

}
.supervisor-documents-shell,

}
.supervisor-doc-summary {

.supervisor-doc-classroom-icon {

    height: 42px;

    color: #2563eb;

.supervisor-doc-summary-card span,
.supervisor-doc-student-card span,
.supervisor-doc-student-card small,
.supervisor-doc-membership-row small {

    color: #8390a3;
    font-size: .72rem;
}
.supervisor-doc-summary-card strong {
    display: block;

    font-size: 1.35rem;

    font-weight: 850;
}
.supervisor-doc-filter-card,
.supervisor-doc-classroom-card,
.supervisor-doc-files-card,
.supervisor-doc-preview-card,
.supervisor-doc-student-card,
.supervisor-doc-memberships-card {

    border-radius: 13px;
    background: #fff;

}
.supervisor-doc-filter-card { margin-bottom: 14px; padding: 9px; }

.supervisor-doc-filter-actions { display: flex; align-items: center; gap: 7px; }

.supervisor-doc-filter-actions button,

.supervisor-doc-filter-actions a:hover,
.supervisor-doc-back:hover { background: #eff6ff; color: #1d4ed8; }

.supervisor-doc-classroom-card { overflow: hidden; }
.supervisor-doc-classroom-header {

.supervisor-doc-classroom-title { min-width: 0; display: flex; align-items: center; gap: 12px; }

.supervisor-doc-table th {

    background: #f8fafc;

    font-size: .68rem;
    font-weight: 850;
    text-transform: uppercase;

}
.supervisor-doc-table td {

    color: #475569;
    font-size: .74rem;

.supervisor-doc-count { color: #334155; font-weight: 800; }

.supervisor-doc-empty strong,
.supervisor-doc-empty span { display: block; }

.supervisor-doc-back { margin-bottom: 14px; }
.supervisor-doc-folder-heading { margin-bottom: 18px !important; }
.supervisor-doc-folder-overview {

    background: #dbeafe;
    color: #1d4ed8;
    font-size: 1.05rem;
    font-weight: 900;
}
.supervisor-doc-student-card strong { display: block; color: #17233b; font-size: 1rem; font-weight: 850; }
.supervisor-doc-student-card span { margin-top: 4px; }
.supervisor-doc-student-card small { margin-top: 5px; }
.supervisor-doc-memberships-card { padding: 13px 15px; }

.supervisor-doc-card-heading h2 { margin: 0; color: #1e293b; font-size: .85rem; font-weight: 850; }
.supervisor-doc-membership-row { display: flex; gap: 9px; padding: 8px 0; border-top: 1px solid #edf1f5; }

.supervisor-doc-membership-row > span { color: #2563eb; }
.supervisor-doc-membership-row strong { display: block; color: #334155; font-size: .74rem; }
.supervisor-doc-folder-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 14px;
    align-items: stretch;
}
.supervisor-doc-files-card,
.supervisor-doc-preview-card { overflow: hidden; }
.supervisor-doc-card-heading { min-height: 56px; padding: 12px 14px; display: flex; align-items: center; border-bottom: 1px solid #edf1f5; }
.supervisor-doc-card-heading .ui-eyebrow { display: block; margin-bottom: 3px; color: #2563eb; font-size: .62rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
.supervisor-doc-folder-table th { border-top: 0; }
.supervisor-doc-unavailable { color: #94a3b8; font-size: .7rem; }
.supervisor-doc-preview-card { min-height: 360px; display: flex; flex-direction: column; }
.supervisor-doc-preview-body {
    width: 100%;
    min-height: 300px;
    flex: 1;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    background: #fbfdff;
    color: inherit;
    font: inherit;
    text-align: center;
    cursor: pointer;
}
.supervisor-doc-preview-body:not(:disabled):hover { background: #f3f7ff; }
.supervisor-doc-preview-body:disabled { cursor: default; }
.supervisor-doc-preview-placeholder strong,
.supervisor-doc-preview-file strong { display: block; color: #334155; font-size: .78rem; font-weight: 850; }
.supervisor-doc-preview-placeholder small,
.supervisor-doc-preview-file small { display: block; margin-top: 5px; color: #8b98aa; font-size: .68rem; }
.supervisor-doc-preview-icon,
.supervisor-doc-preview-file > span { display: block; margin-bottom: 10px; color: #2563eb; font-size: 34px; }
.supervisor-doc-preview-image { width: 100%; max-height: 330px; object-fit: contain; border-radius: 8px; }
@media (max-width: 1050px) {

    .supervisor-doc-filter-grid input { grid-column: 1 / -1; }
    .supervisor-doc-folder-overview,
    .supervisor-doc-folder-layout { grid-template-columns: 1fr; }

@media (max-width: 760px) {

    .supervisor-doc-filter-grid { grid-template-columns: 1fr; }
    .supervisor-doc-filter-grid input { grid-column: auto; }
    .supervisor-doc-classroom-header { align-items: flex-start; }
    .supervisor-doc-status-pill { margin-top: 4px; }
}
