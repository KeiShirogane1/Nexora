{# Shared identity, action, chat, export, and consistency layer for all Nexora roles. #}
<style id="nx-people-action-system">
:root{--nx-button-radius:12px}
/* One button geometry across portals. Deliberately circular identity/floating controls are restored below. */
button,
a.btn,
.btn,
.ui-primary-btn,
.ui-secondary-btn,
.student-tasks-primary-button,
.btn-nexora-primary,
.btn-nexora-secondary,
.btn-view,
.btn-more,
.btn-approve,
.btn-reject,
.btn-bulk-activate,
.btn-bulk-deactivate,
.btn-bulk-delete,
.admin-file-action,
.supervisor-doc-action,
.nx-quick-chat-btn,
.nx-copy-username,
.nx-export-choice{
    border-radius:var(--nx-button-radius)!important;
}
.rounded-circle,
[class*="avatar-button"],
[class*="avatar-wrap"] button,
.nx-assistant-fab,
.nx-assistant-launcher,
.nx-assistant-trigger,
.nexora-assistant-fab{
    border-radius:50%!important;
}

/* Keep opened row menus above every adjacent table button/card. */
.more-actions{position:relative;z-index:20}
.dropdown-menu-nexora.show{z-index:5000!important}
tr:has(.dropdown-menu-nexora.show),
td:has(.dropdown-menu-nexora.show),
.actions-cell:has(.dropdown-menu-nexora.show){position:relative!important;z-index:4990!important}
.table-responsive:has(.dropdown-menu-nexora.show),
.table-card:has(.dropdown-menu-nexora.show),
.nexora-card:has(.dropdown-menu-nexora.show){overflow:visible!important}

.nx-username-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:5px 0 0;color:#64748b;font-size:.76rem;font-weight:750;line-height:1.3}
.nx-username-text{overflow-wrap:anywhere}
.nx-copy-username{width:1.05em;height:1.05em;min-width:0;padding:0;border:0!important;background:transparent!important;color:inherit;display:inline-grid;place-items:center;line-height:1;cursor:pointer;box-shadow:none!important}
.nx-copy-username:hover{border:0!important;background:transparent!important;color:var(--nx-role-kpi-accent,#2563eb)}
.nx-copy-username:active{background:transparent!important;color:color-mix(in srgb,var(--nx-role-kpi-accent,#2563eb) 78%,#0f172a)}
.nx-copy-username:focus-visible{outline:2px solid var(--nx-role-kpi-accent,#2563eb);outline-offset:2px}
.nx-copy-username svg{width:.95em;height:.95em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Shared close-button geometry, with role-specific hover accents. */
.nexora-modal-close,.nexora-logout-close,.admin-notification-close{
    border:1px solid #d8e0e8!important;
    background:#fff!important;
    color:#111827!important;
    box-shadow:none!important;
}
body:has(.nx-role-sidebar-shell.nx-role-admin) .nexora-modal-close:hover,
body:has(.nx-role-sidebar-shell.nx-role-admin) .nexora-logout-close:hover,
body:has(.nx-role-sidebar-shell.nx-role-admin) .admin-notification-close:hover{
    border-color:#f45125!important;
    background:#fff!important;
    color:#f45125!important;
}
body:has(.nx-role-sidebar-shell.nx-role-supervisor) .nexora-modal-close:hover,
body:has(.nx-role-sidebar-shell.nx-role-supervisor) .nexora-logout-close:hover{
    border-color:#2563eb!important;
    background:#fff!important;
    color:#2563eb!important;
}

.nx-quick-chat-btn{min-height:36px;padding:0 12px;border:1px solid color-mix(in srgb,var(--nx-role-kpi-accent,#2563eb) 52%,#d7e0ec);background:#fff;color:var(--nx-role-kpi-accent,#2563eb);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.75rem;font-weight:800;white-space:nowrap}
.nx-quick-chat-btn:hover{background:var(--nx-role-kpi-soft,#eff5ff);border-color:var(--nx-role-kpi-accent,#2563eb);color:var(--nx-role-kpi-accent,#2563eb)}
.nx-quick-chat-btn svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nx-profile-quick-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}

.nx-export-modal .nexora-modal{max-width:610px}
.nx-export-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nx-export-choice{min-height:118px;padding:16px;border:1px solid #dce5ef;background:#fff;color:#17233d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;cursor:pointer}
.nx-export-choice:hover{border-color:var(--nx-role-kpi-accent,#e7512d);background:var(--nx-role-kpi-soft,#fff0ea);transform:translateY(-1px)}
.nx-export-choice svg{width:28px;height:28px;fill:none;stroke:var(--nx-role-kpi-accent,#e7512d);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nx-export-choice strong{font-size:.84rem;font-weight:900}
.nx-export-choice small{color:#718096;font-size:.66rem;line-height:1.35}
.nx-export-note{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:.68rem;line-height:1.45}

@media(max-width:680px){.nx-export-grid{grid-template-columns:1fr}.nx-export-choice{min-height:82px;flex-direction:row;text-align:left;justify-content:flex-start}.nx-quick-chat-btn{min-height:34px;padding:0 10px}}
</style>

<script>
(function(){
    'use strict';
    var role={{ (session.get('role') or '')|tojson }};
    var currentUsername={{ (session.get('username') or '')|tojson }};
    var copySvg='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path></svg>';
    var chatSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>';
    var programAliases={
        'bsit':'Bachelor of Science in Information Technology',
        'bs information technology':'Bachelor of Science in Information Technology',
        'bs in information technology':'Bachelor of Science in Information Technology',
        'bachelor of science in information technology':'Bachelor of Science in Information Technology',
        'bscs':'Bachelor of Science in Computer Science',
        'bs computer science':'Bachelor of Science in Computer Science',
        'bs in computer science':'Bachelor of Science in Computer Science',
        'bachelor of science in computer science':'Bachelor of Science in Computer Science',
        'bsis':'Bachelor of Science in Information Systems',
        'bs information systems':'Bachelor of Science in Information Systems',
        'bs in information systems':'Bachelor of Science in Information Systems',
        'bachelor of science in information systems':'Bachelor of Science in Information Systems',
        'bscpe':'Bachelor of Science in Computer Engineering',
        'bscpe.':'Bachelor of Science in Computer Engineering',
        'bs computer engineering':'Bachelor of Science in Computer Engineering',
        'bs in computer engineering':'Bachelor of Science in Computer Engineering',
        'bachelor of science in computer engineering':'Bachelor of Science in Computer Engineering'
    };
    var canonicalPrograms=[
        'Bachelor of Science in Information Technology',
        'Bachelor of Science in Computer Science',
        'Bachelor of Science in Information Systems',
        'Bachelor of Science in Computer Engineering'
    ];

    function normalizeProgram(value){
        var original=String(value||'').trim();
        if(!original)return original;
        return programAliases[original.toLowerCase()]||original;
    }

    function notifyCopied(){
        if(typeof window.showToast==='function'){window.showToast('Username copied.');return;}
        var existing=document.getElementById('nxCopyUsernameToast');
        if(existing)existing.remove();
        var toast=document.createElement('div');
        toast.id='nxCopyUsernameToast';
        toast.textContent='Username copied';
        toast.style.cssText='position:fixed;right:22px;bottom:22px;z-index:10020;padding:10px 13px;border-radius:12px;background:#0f172a;color:#fff;font:700 12px/1.2 inherit;box-shadow:0 10px 30px rgba(15,23,42,.22)';
        document.body.appendChild(toast);
        window.setTimeout(function(){toast.remove();},1500);
    }

    function copyText(value){
        var text=String(value||'').replace(/^@/,'').trim();
        if(!text)return;
        if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(notifyCopied).catch(function(){fallbackCopy(text);});return;}
        fallbackCopy(text);
    }
    function fallbackCopy(text){
        var area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
        try{document.execCommand('copy');notifyCopied();}catch(e){}
        area.remove();
    }

    function usernameLine(username){
        username=String(username||'').replace(/^@/,'').trim();
        if(!username)return null;
        var line=document.createElement('div');line.className='nx-username-line';line.dataset.nxUsername=username;
        var text=document.createElement('span');text.className='nx-username-text';text.textContent='@'+username;
        var copy=document.createElement('button');copy.type='button';copy.className='nx-copy-username';copy.title='Copy username';copy.setAttribute('aria-label','Copy @'+username);copy.innerHTML=copySvg;
        copy.addEventListener('click',function(event){event.preventDefault();event.stopPropagation();copyText(username);});
        line.appendChild(text);line.appendChild(copy);return line;
    }

    function enhanceExistingUsernameLine(node){
        if(!node||node.querySelector('.nx-copy-username'))return;
        var raw=String(node.textContent||'').trim();
        if(!raw.startsWith('@'))return;
        var username=raw.slice(1).trim();
        node.classList.add('nx-username-line');node.textContent='';
        var text=document.createElement('span');text.className='nx-username-text';text.textContent='@'+username;node.appendChild(text);
        var copy=document.createElement('button');copy.type='button';copy.className='nx-copy-username';copy.title='Copy username';copy.setAttribute('aria-label','Copy @'+username);copy.innerHTML=copySvg;copy.addEventListener('click',function(e){e.preventDefault();copyText(username);});node.appendChild(copy);
    }

    function chatLink(userId,label){
        var id=parseInt(userId,10);if(!id)return null;
        var link=document.createElement('a');link.className='nx-quick-chat-btn';link.href='/messages/open/'+encodeURIComponent(id);link.innerHTML=chatSvg+'<span>'+(label||'Chat')+'</span>';link.setAttribute('aria-label','Open quick chat');return link;
    }
    function appendChat(container,userId){
        if(!container||container.querySelector('.nx-quick-chat-btn'))return;
        var link=chatLink(userId);if(link)container.appendChild(link);
    }
    function authorizedContact(targetRole,userId){
        var id=parseInt(userId,10);if(!id)return Promise.resolve(null);
        return fetch('/messages/contacts?role='+encodeURIComponent(targetRole),{headers:{Accept:'application/json'},cache:'no-store'})
            .then(function(response){return response.ok?response.json():Promise.reject();})
            .then(function(data){return (data.contacts||[]).find(function(contact){return parseInt(contact.id,10)===id;})||null;});
    }

    function expandProgramText(){
        var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(node){
            var parent=node.parentElement;if(!parent||/^(SCRIPT|STYLE|TEXTAREA)$/.test(parent.tagName))return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
        }});
        var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
        nodes.forEach(function(node){
            var text=node.nodeValue;if(!text)return;
            var replaced=text
                .replace(/\bBSIT\b/gi,'Bachelor of Science in Information Technology')
                .replace(/\bBSCS\b/gi,'Bachelor of Science in Computer Science')
                .replace(/\bBSIS\b/gi,'Bachelor of Science in Information Systems')
                .replace(/\bBSCPE\b/gi,'Bachelor of Science in Computer Engineering')
                .replace(/\bBS Information Technology\b/gi,'Bachelor of Science in Information Technology');
            if(replaced!==text)node.nodeValue=replaced;
        });

        document.querySelectorAll('input[name="major_program"],input[name="program"]').forEach(function(input){
            if(input.value)input.value=normalizeProgram(input.value);
            var form=input.form;if(form&&!form.dataset.nxProgramNormalize){form.dataset.nxProgramNormalize='1';form.addEventListener('submit',function(){var target=form.querySelector('input[name="major_program"],input[name="program"]');if(target)target.value=normalizeProgram(target.value);});}
        });
        document.querySelectorAll('select[name="program"],select[name="major_program"]').forEach(function(select){
            if(select.dataset.nxProgramDatabase==='true')return;
            Array.from(select.options).forEach(function(option){var full=normalizeProgram(option.textContent);if(full!==option.textContent.trim()){option.textContent=full;option.value=full;}});
            canonicalPrograms.forEach(function(program){if(!Array.from(select.options).some(function(option){return option.value===program;})){var option=document.createElement('option');option.value=program;option.textContent=program;select.appendChild(option);}});
            if(!Array.from(select.options).some(function(option){return option.value==='Other / Specify Program';})){var other=document.createElement('option');other.value='Other / Specify Program';other.textContent='Other / Specify Program';select.appendChild(other);}
        });
    }

    function decorateProfiles(){
        var path=window.location.pathname;
        if(path==='/student/profile'&&currentUsername){var studentHead=document.querySelector('.profile-hero-details h2');if(studentHead&&!studentHead.parentElement.querySelector('.nx-username-line'))studentHead.insertAdjacentElement('afterend',usernameLine(currentUsername));}
        if(path==='/supervisor/profile'&&currentUsername){var supHead=document.querySelector('.sp-identity h2');if(supHead&&!supHead.parentElement.querySelector('.nx-username-line'))supHead.insertAdjacentElement('afterend',usernameLine(currentUsername));}

        document.querySelectorAll('.profile-title p').forEach(enhanceExistingUsernameLine);

        var adminStudent=path.match(/^\/admin\/student\/(\d+)\/?$/);
        var adminSupervisor=path.match(/^\/admin\/supervisor\/(\d+)\/?$/)||path.match(/^\/admin\/users\/supervisors\/(\d+)\/?$/);
        var supervisorStudent=path.match(/^\/supervisor\/student\/(\d+)\/?$/);
        if(adminStudent){var actions=document.querySelector('.profile-actions');appendChat(actions,adminStudent[1]);}
        if(adminSupervisor){
            var supActions=document.querySelector('.profile-actions');appendChat(supActions,adminSupervisor[1]);
            var adminSupHeading=document.querySelector('.profile-title h2');
            authorizedContact('supervisor',adminSupervisor[1]).then(function(contact){
                if(contact&&adminSupHeading&&contact.display_name)adminSupHeading.textContent=contact.display_name;
            }).catch(function(){});
        }
        if(supervisorStudent){
            var legacyH2=document.querySelector('.profile-info h2');
            var profileInfo=document.querySelector('.profile-info');
            var fallbackUsername=legacyH2?String(legacyH2.textContent||'').trim():'';
            var legacyMeta=legacyH2&&legacyH2.parentElement?legacyH2.parentElement.querySelector('p.text-muted'):null;
            if(legacyMeta&&/BSIT|Arellano University/i.test(legacyMeta.textContent||''))legacyMeta.remove();
            if(legacyH2&&!legacyH2.parentElement.querySelector('.nx-username-line')&&fallbackUsername)legacyH2.insertAdjacentElement('afterend',usernameLine(fallbackUsername));
            if(profileInfo&&!profileInfo.querySelector('.nx-profile-quick-actions')){var quick=document.createElement('div');quick.className='nx-profile-quick-actions';appendChat(quick,supervisorStudent[1]);profileInfo.appendChild(quick);}
            authorizedContact('student',supervisorStudent[1]).then(function(contact){
                if(!contact||!legacyH2)return;
                legacyH2.textContent=contact.display_name||contact.username||fallbackUsername;
                var usernameRow=legacyH2.parentElement.querySelector('.nx-username-line');
                if(usernameRow)usernameRow.remove();
                var actualUsername=contact.username||fallbackUsername;
                if(actualUsername)legacyH2.insertAdjacentElement('afterend',usernameLine(actualUsername));
                var program=normalizeProgram(contact.major_program||'');
                var currentProgram=legacyH2.parentElement.querySelector('.nx-student-program');
                if(currentProgram)currentProgram.remove();
                if(program){
                    var programLine=document.createElement('p');programLine.className='text-muted mb-0 nx-student-program';programLine.textContent=program;
                    var usernameElement=legacyH2.parentElement.querySelector('.nx-username-line');
                    (usernameElement||legacyH2).insertAdjacentElement('afterend',programLine);
                }
            }).catch(function(){});
        }

        var classmate=path.match(/^\/student\/classes\/\d+\/people\/(\d+)\/?$/);
        if(classmate){
            var hero=document.querySelector('.profile-hero-details');
            if(hero&&!hero.querySelector('.nx-username-line')){
                var username='';document.querySelectorAll('.info-list>div').forEach(function(row){var label=row.querySelector('b');if(label&&label.textContent.trim()==='Username'){var value=row.querySelector('span');username=value?value.textContent.trim():'';}});
                var heading=hero.querySelector('h2');if(username&&heading)heading.insertAdjacentElement('afterend',usernameLine(username));
            }
            var classmateActions=document.querySelector('.profile-actions');appendChat(classmateActions,classmate[1]);
        }
    }

    function decorateAdminDirectories(){
        document.querySelectorAll('#studentsTable tbody tr[data-id],#supervisorsTable tbody tr[data-id]').forEach(function(row){
            if(String(row.dataset.status||'active')!=='active')return;
            var actions=row.querySelector('.actions-cell');var view=actions&&actions.querySelector('.btn-view');if(!actions||!view||actions.querySelector('.nx-quick-chat-btn'))return;
            var link=chatLink(row.dataset.id);if(link)view.insertAdjacentElement('afterend',link);
        });
        if(window.location.pathname.indexOf('/admin/supervisor/')===0||window.location.pathname.indexOf('/admin/users/supervisor')===0){
            document.querySelectorAll('a[href*="/admin/student/"]').forEach(function(view){var match=view.getAttribute('href').match(/\/admin\/student\/(\d+)/);if(match&&view.parentElement&&!view.parentElement.querySelector('.nx-quick-chat-btn'))view.insertAdjacentElement('afterend',chatLink(match[1]));});
        }
    }

    function decorateSupervisorInterns(){
        if(window.location.pathname!=='/supervisor/interns')return;
        document.querySelectorAll('a[data-insights-modal-open][data-insights-view="individual"]').forEach(function(view){var raw=view.getAttribute('data-individual-url')||view.getAttribute('href')||'';var ids=raw.match(/\d+/g);var id=ids&&ids.length?ids[ids.length-1]:null;if(id&&!view.parentElement.querySelector('.nx-quick-chat-btn'))view.insertAdjacentElement('afterend',chatLink(id));});
        document.querySelectorAll('a[href^="/supervisor/student/"]').forEach(function(view){var match=view.getAttribute('href').match(/\/supervisor\/student\/(\d+)/);if(match&&view.parentElement&&!view.parentElement.querySelector('.nx-quick-chat-btn'))view.insertAdjacentElement('afterend',chatLink(match[1]));});
    }

    function decorateStudentPeople(){
        if(!/^\/student\/classes\/\d+\/?$/.test(window.location.pathname))return;
        document.querySelectorAll('.person-actions a[href*="/people/"]').forEach(function(view){var match=view.getAttribute('href').match(/\/people\/(\d+)/);if(match&&!view.parentElement.querySelector('.nx-quick-chat-btn'))view.insertAdjacentElement('afterend',chatLink(match[1]));});
        var teacherView=document.querySelector('.person-actions a[href$="/teacher"]');
        if(teacherView&&!teacherView.parentElement.querySelector('.nx-quick-chat-btn')){
            var row=teacherView.closest('.person');var username=row&&row.querySelector('.person-info strong')?row.querySelector('.person-info strong').textContent.trim():'';
            fetch('/messages/contacts?role=supervisor',{headers:{Accept:'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject();}).then(function(data){var contact=(data.contacts||[]).find(function(item){return String(item.username||'').toLowerCase()===username.toLowerCase();});if(contact&&!teacherView.parentElement.querySelector('.nx-quick-chat-btn'))teacherView.insertAdjacentElement('afterend',chatLink(contact.id));}).catch(function(){});
        }
    }

    function decorateTeacherProfile(){
        if(!/^\/student\/classes\/\d+\/teacher\/?$/.test(window.location.pathname))return;
        var nameNode=document.querySelector('.tp-name h1');if(!nameNode)return;
        var display=String(nameNode.textContent||'').replace('✓','').trim();
        fetch('/messages/contacts?role=supervisor',{headers:{Accept:'application/json'},cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject();}).then(function(data){var contacts=data.contacts||[];var contact=contacts.find(function(item){return String(item.display_name||'').trim().toLowerCase()===display.toLowerCase();})||(contacts.length===1?contacts[0]:null);if(!contact)return;if(!nameNode.parentElement.querySelector('.nx-username-line'))nameNode.insertAdjacentElement('afterend',usernameLine(contact.username));var actions=nameNode.parentElement.querySelector('.nx-profile-quick-actions');if(!actions){actions=document.createElement('div');actions.className='nx-profile-quick-actions';nameNode.parentElement.appendChild(actions);}appendChat(actions,contact.id);}).catch(function(){});
    }

    function removeAdminProfileDocuments(){
        if(!/^\/admin\/student\/\d+\/?$/.test(window.location.pathname))return;
        document.querySelectorAll('.dashboard-box>h3').forEach(function(head){if(head.textContent.trim()==='Documents'){var box=head.closest('.dashboard-box');if(box)box.remove();}});
    }

    function visibleSupervisorRows(){
        var rows=Array.from(document.querySelectorAll('#supervisorsTable tbody tr[data-id]')).filter(function(row){return row.style.display!=='none';});
        var headers=['#','Supervisor','Email','Role / Status','Assigned Students'];
        var body=rows.map(function(row){var c=row.querySelectorAll('td');return [c[1]?c[1].innerText.trim():'',c[2]?c[2].innerText.trim().replace(/\s+/g,' '):'',c[3]?c[3].innerText.trim():'',c[4]?c[4].innerText.trim().replace(/\s+/g,' '):'',c[5]?c[5].innerText.trim():''];});
        return {headers:headers,rows:body};
    }
    function csvEscape(value){var text=String(value==null?'':value);return /[",\n]/.test(text)?'"'+text.replace(/"/g,'""')+'"':text;}
    function downloadBlob(blob,name){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();window.setTimeout(function(){URL.revokeObjectURL(url);},200);}
    function exportSupervisorsCsv(data){var lines=[data.headers.map(csvEscape).join(',')].concat(data.rows.map(function(row){return row.map(csvEscape).join(',');}));downloadBlob(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'Supervisor-List.csv');}
    function loadScript(src,globalName){return new Promise(function(resolve,reject){if(globalName&&window[globalName]){resolve();return;}var existing=document.querySelector('script[data-nx-src="'+src+'"]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}var script=document.createElement('script');script.src=src;script.dataset.nxSrc=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});}
    function exportSupervisorsXlsx(data){return loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX').then(function(){var sheet=XLSX.utils.aoa_to_sheet([data.headers].concat(data.rows));var book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,sheet,'Supervisors');XLSX.writeFile(book,'Supervisor-List.xlsx');});}
    function exportSupervisorsPdf(data){return loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js').then(function(){return loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js');}).then(function(){var jsPDF=window.jspdf&&window.jspdf.jsPDF;if(!jsPDF)throw new Error('PDF engine unavailable');var doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});doc.setFontSize(18);doc.text('Nexora Supervisor List',40,42);doc.setFontSize(9);doc.setTextColor(100);doc.text('Visible supervisors exported from Supervisor Management',40,60);doc.autoTable({head:[data.headers],body:data.rows,startY:78,styles:{fontSize:8,cellPadding:5},headStyles:{fillColor:[231,81,45]},margin:{left:40,right:40}});doc.save('Supervisor-List.pdf');});}

    function setupSupervisorExport(){
        if(window.location.pathname!=='/admin/users/supervisors')return;
        var originalTrigger=document.getElementById('exportSupervisorsBtn');if(!originalTrigger||originalTrigger.dataset.nxExportReady==='1')return;
        /* Replace the legacy trigger node so its old CSV listener cannot fire alongside the new modal flow. */
        var trigger=originalTrigger.cloneNode(true);originalTrigger.replaceWith(trigger);trigger.dataset.nxExportReady='1';trigger.title='Export visible supervisors';
        var overlay=document.createElement('div');overlay.className='nexora-modal-overlay nx-export-modal';overlay.id='nxSupervisorExportModal';overlay.setAttribute('aria-hidden','true');overlay.innerHTML='<div class="nexora-modal" role="dialog" aria-modal="true" aria-labelledby="nxExportTitle"><div class="nexora-modal-header"><h2 id="nxExportTitle">Export Supervisor List</h2><p>Choose a file format. Only supervisors currently visible in the filtered directory will be exported.</p><button type="button" class="nexora-modal-close" data-nx-export-close aria-label="Close">×</button></div><div class="nexora-modal-body"><div class="nx-export-grid"><button type="button" class="nx-export-choice" data-format="csv"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h8"></path></svg><strong>CSV</strong><small>Supervisor-List.csv</small></button><button type="button" class="nx-export-choice" data-format="xlsx"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4zM4 9h16M10 9v12"></path></svg><strong>Excel</strong><small>Supervisor-List.xlsx</small></button><button type="button" class="nx-export-choice" data-format="pdf"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h5"></path></svg><strong>PDF</strong><small>Supervisor-List.pdf</small></button></div><p class="nx-export-note">CSV is best for simple data exchange, Excel preserves a spreadsheet workbook, and PDF creates a formatted read-only directory report.</p></div><div class="nexora-modal-footer"><button type="button" class="btn-nexora-secondary" data-nx-export-close>Cancel</button></div></div>';
        document.body.appendChild(overlay);
        function open(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
        function close(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';}
        trigger.addEventListener('click',function(event){event.preventDefault();open();});
        overlay.querySelectorAll('[data-nx-export-close]').forEach(function(btn){btn.addEventListener('click',close);});overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
        overlay.querySelectorAll('[data-format]').forEach(function(btn){btn.addEventListener('click',function(){var data=visibleSupervisorRows();if(!data.rows.length){if(window.showToast)window.showToast('No visible supervisors to export.','warning');return;}var format=btn.dataset.format;var original=btn.innerHTML;btn.disabled=true;if(format==='csv'){exportSupervisorsCsv(data);btn.disabled=false;close();return;}var job=format==='xlsx'?exportSupervisorsXlsx(data):exportSupervisorsPdf(data);job.then(function(){close();}).catch(function(){if(window.showToast)window.showToast('Unable to create that export. Please check your connection and try again.','error');}).finally(function(){btn.disabled=false;btn.innerHTML=original;});});});
    }

    function boot(){
        expandProgramText();decorateProfiles();decorateAdminDirectories();decorateSupervisorInterns();decorateStudentPeople();decorateTeacherProfile();removeAdminProfileDocuments();setupSupervisorExport();
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
