<script>
(function () {
    var favicon = document.querySelector('link[rel~="icon"]');
    if (!favicon) {
        favicon = document.createElement('link');
        favicon.rel = 'icon';
        document.head.appendChild(favicon);
    }
    favicon.type = 'image/png';
    favicon.href = "{{ url_for('static', filename='images/nexora_logo_supervisor.png') }}";
})();
</script>
<nav class="nexora-navbar">

    <div class="nexora-nav-left">

        <button class="sidebar-toggle" id="sidebarToggle">
            ☰
        </button>

        <div class="nexora-logo">

            <img src="{{ url_for('static', filename='images/nexora_logo_supervisor.png') }}"
                 alt="Nexora Logo"
                 class="logo-image">

            <span class="logo-text">
                Nexora
            </span>

        </div>

    </div>


    <div class="nexora-nav-right">

        <div class="user-menu">

            <span class="user-name">
                Shean Patrick Venus
            </span>

            <a href="/logout"
               class="profile-button"
               onclick="return confirm('Are you sure you want to logout?')">

                <img src="{{ url_for('static', filename='images/default_profile.png') }}"
                     alt="Logout"
                     class="logout-icon">

            </a>

        </div>

    </div>

</nav>
