{# Shared select enhancement. Filter selects are upgraded automatically; other selects can opt in with data-nx-select. #}
<script>
(function () {
    function enhance(select) {
        if (!select || select.dataset.nxSelectReady === '1' || select.multiple || select.size > 1) return;
        select.dataset.nxSelectReady = '1';

        var shell = document.createElement('div');
        shell.className = 'nx-select-shell';
        select.parentNode.insertBefore(shell, select);
        shell.appendChild(select);
        select.classList.add('nx-select-native');

        var trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'nx-select-trigger';
        trigger.setAttribute('aria-haspopup', 'listbox');
        trigger.setAttribute('aria-expanded', 'false');
        trigger.innerHTML = '<span class="nx-select-trigger-label"></span><span class="nx-select-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"></path></svg></span>';

        var menu = document.createElement('div');
        menu.className = 'nx-select-menu';
        menu.setAttribute('role', 'listbox');
        menu.hidden = true;

        shell.appendChild(trigger);
        shell.appendChild(menu);

        function selectedOption() {
            return select.options[select.selectedIndex] || select.options[0] || null;
        }

        function syncLabel() {
            var option = selectedOption();
            trigger.querySelector('.nx-select-trigger-label').textContent = option ? option.textContent : '';
            menu.querySelectorAll('.nx-select-option').forEach(function (item) {
                item.classList.toggle('is-selected', item.dataset.value === select.value);
                item.setAttribute('aria-selected', item.dataset.value === select.value ? 'true' : 'false');
            });
        }

        function close() {
            shell.classList.remove('is-open');
            menu.hidden = true;
            trigger.setAttribute('aria-expanded', 'false');
        }

        function open() {
            document.querySelectorAll('.nx-select-shell.is-open').forEach(function (other) {
                if (other === shell) return;
                other.classList.remove('is-open');
                var otherMenu = other.querySelector('.nx-select-menu');
                var otherTrigger = other.querySelector('.nx-select-trigger');
                if (otherMenu) otherMenu.hidden = true;
                if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
            });
            shell.classList.add('is-open');
            menu.hidden = false;
            trigger.setAttribute('aria-expanded', 'true');
            var current = menu.querySelector('.nx-select-option.is-selected') || menu.querySelector('.nx-select-option:not(:disabled)');
            if (current) window.requestAnimationFrame(function () { current.focus(); });
        }

        function rebuild() {
            menu.innerHTML = '';
            Array.prototype.forEach.call(select.options, function (option) {
                var item = document.createElement('button');
                item.type = 'button';
                item.className = 'nx-select-option';
                item.setAttribute('role', 'option');
                item.dataset.value = option.value;
                item.textContent = option.textContent;
                item.disabled = option.disabled;
                item.addEventListener('click', function () {
                    if (item.disabled) return;
                    select.value = item.dataset.value;
                    select.dispatchEvent(new Event('change', {bubbles: true}));
                    syncLabel();
                    close();
                    trigger.focus();
                });
                menu.appendChild(item);
            });
            syncLabel();
        }

        trigger.addEventListener('click', function () {
            if (menu.hidden) open(); else close();
        });
        trigger.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                open();
            }
        });
        menu.addEventListener('keydown', function (event) {
            var options = Array.prototype.filter.call(menu.querySelectorAll('.nx-select-option'), function (item) { return !item.disabled; });
            var index = options.indexOf(document.activeElement);
            if (event.key === 'Escape') {
                event.preventDefault(); close(); trigger.focus(); return;
            }
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                event.preventDefault();
                var delta = event.key === 'ArrowDown' ? 1 : -1;
                var next = Math.max(0, Math.min(options.length - 1, index + delta));
                if (options[next]) options[next].focus();
            }
        });
        select.addEventListener('change', syncLabel);
        new MutationObserver(rebuild).observe(select, {childList: true, subtree: true, attributes: true});
        rebuild();
    }

    function boot() {
        document.querySelectorAll([
            'select[data-nx-select]',
            'form[class*="filter"] select',
            '[class*="filter"] > select',
            '[class*="filters"] select'
        ].join(',')).forEach(enhance);

        document.addEventListener('click', function (event) {
            document.querySelectorAll('.nx-select-shell.is-open').forEach(function (shell) {
                if (shell.contains(event.target)) return;
                shell.classList.remove('is-open');
                var menu = shell.querySelector('.nx-select-menu');
                var trigger = shell.querySelector('.nx-select-trigger');
                if (menu) menu.hidden = true;
                if (trigger) trigger.setAttribute('aria-expanded', 'false');
            });
        });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, {once: true});
    else boot();
})();
</script>
