{#
    Shared role page-heading normalization.
    Student Dashboard is the visual reference; role accent colors remain distinct.
#}
<style id="nx-role-page-heading-style">
body.student-page {
    --nx-page-heading-accent: #0a8f46;
    --nx-page-heading-ink: #10261d;
    --nx-page-heading-muted: #718078;
}
body.supervisor-dashboard-page,
body.supervisor-page,
body.work-page,
body.supervisor-classes-page {
    --nx-page-heading-accent: #2563eb;
    --nx-page-heading-ink: #17233b;
    --nx-page-heading-muted: #64748b;
}
body.nexora-admin-body,
body.admin-page {
    --nx-page-heading-accent: #ea5b2a;
    --nx-page-heading-ink: #10251f;
    --nx-page-heading-muted: #6c7d78;
}
body.nx-notifications-page.notification-role-student {
    --nx-page-heading-accent: #0a8f46;
    --nx-page-heading-ink: #10261d;
    --nx-page-heading-muted: #718078;
}
body.nx-notifications-page.notification-role-supervisor {
    --nx-page-heading-accent: #2563eb;
    --nx-page-heading-ink: #17233b;
    --nx-page-heading-muted: #64748b;
}
body.nx-notifications-page.notification-role-admin {
    --nx-page-heading-accent: #ea5b2a;
    --nx-page-heading-ink: #173028;
    --nx-page-heading-muted: #6f817b;
}

/* Canonical page-heading geometry. Existing page actions remain on the right. */
body.student-page .student-section-heading,
body.supervisor-dashboard-page .supervisor-heading-row,
body.work-page .supervisor-classwork-heading,
body.supervisor-page .sp-heading,
body.supervisor-classes-page .supervisor-classes-header,
body.nexora-admin-body .students-page-header,
body.nexora-admin-body .supervisors-page-header,
body.nexora-admin-body .dashboard-header,
body.admin-page .ui-page-heading,
body.nx-notifications-page .nx-notifications-heading {
    display: flex !important;
    align-items: flex-end !important;
    justify-content: space-between !important;
    gap: 24px !important;
}

body.student-page .student-section-heading,
body.work-page .supervisor-classwork-heading,
body.supervisor-page .sp-heading,
body.supervisor-classes-page .supervisor-classes-header,
body.nexora-admin-body .students-page-header,
body.nexora-admin-body .supervisors-page-header,
body.nexora-admin-body .dashboard-header,
body.admin-page .ui-page-heading,
body.nx-notifications-page .nx-notifications-heading {
    margin-top: 0 !important;
    margin-bottom: 24px !important;
}

/* Old Admin page headers were cards. Page headings are now open like Student. */
body.nexora-admin-body .students-page-header,
body.nexora-admin-body .supervisors-page-header,
body.nexora-admin-body .dashboard-header,
body.admin-page .ui-page-heading {
    min-height: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
}

/* Student Dashboard heading typography is the canonical role-page scale. */
body.student-page .student-section-heading h1,
body.student-documents-page .student-documents-title h1,
body.supervisor-dashboard-page .supervisor-dashboard-heading h1,
body.work-page .supervisor-classwork-heading h1,
body.supervisor-page .sp-heading h1,
body.supervisor-classes-page .supervisor-classes-header h1,
body.nexora-admin-body .students-page-header h1,
body.nexora-admin-body .supervisors-page-header h1,
body.nexora-admin-body .dashboard-header h1,
body.admin-dashboard-page .admin-hero-card h1,
body.admin-documents-page .admin-documents-title h1,
body.admin-page .ui-page-heading h1,
body.nx-notifications-page .nx-notifications-heading h1 {
    margin: 0 !important;
    color: var(--nx-page-heading-ink, #10261d) !important;
    font-size: 2rem !important;
    line-height: 1.1 !important;
    font-weight: 800 !important;
    letter-spacing: -0.035em !important;
}

body.student-page .student-section-heading p,
body.student-documents-page .student-documents-title p,
body.supervisor-dashboard-page .supervisor-dashboard-heading p,
body.work-page .supervisor-classwork-heading p,
body.supervisor-page .sp-heading p,
body.supervisor-classes-page .supervisor-classes-header p,
body.nexora-admin-body .students-page-header p,
body.nexora-admin-body .supervisors-page-header p,
body.nexora-admin-body .dashboard-header p,
body.admin-dashboard-page .admin-hero-copy > p,
body.admin-documents-page .admin-documents-title p,
body.admin-page .ui-page-heading p,
body.nx-notifications-page .nx-notifications-heading p {
    margin: 7px 0 0 !important;
    color: var(--nx-page-heading-muted, #718078) !important;
    font-size: 0.9rem !important;
    line-height: 1.5 !important;
}

body.student-page .student-section-eyebrow,
body.student-documents-page .student-documents-eyebrow,
body.supervisor-dashboard-page .supervisor-breadcrumb,
body.supervisor-page .sp-heading .ui-eyebrow,
body.admin-dashboard-page .admin-eyebrow,
body.admin-documents-page .admin-documents-eyebrow,
body.admin-page .ui-page-heading .ui-eyebrow,
body.nx-notifications-page .nx-notifications-eyebrow,
body.work-page .supervisor-classwork-heading > div:first-child::before,
body.supervisor-classes-page .supervisor-classes-header > div:first-child::before,
body.nexora-admin-body .students-page-header > div:first-child::before,
body.nexora-admin-body .supervisors-page-header > div:first-child::before,
body.nexora-admin-body .dashboard-header > div:first-child::before {
    display: block !important;
    width: auto !important;
    margin: 0 0 7px !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    color: var(--nx-page-heading-accent, #0a8f46) !important;
    font-size: 0.7rem !important;
    line-height: 1.2 !important;
    font-weight: 800 !important;
    letter-spacing: 0.1em !important;
    text-transform: uppercase !important;
}

body.work-page .supervisor-classwork-heading > div:first-child::before,
body.supervisor-classes-page .supervisor-classes-header > div:first-child::before {
    content: "Supervisor Portal";
}
body.nexora-admin-body .students-page-header > div:first-child::before,
body.nexora-admin-body .supervisors-page-header > div:first-child::before,
body.nexora-admin-body .dashboard-header > div:first-child::before {
    content: "Admin Portal";
}

/* Supervisor Dashboard: the eyebrow belongs to the same heading block as Student. */
body.supervisor-dashboard-page .supervisor-dashboard-heading {
    margin: 0 0 24px !important;
}
body.supervisor-dashboard-page .supervisor-breadcrumb {
    margin-bottom: 7px !important;
}

/* Admin Dashboard used to stack a 96px shell reserve + 28px content padding.
   Keep the fixed 68px topbar reserve, then the normal page breathing room. */
body.admin-dashboard-page .admin-main {
    padding-top: 68px !important;
}
body.admin-dashboard-page .admin-dashboard-content {
    width: min(100%, 1440px) !important;
    max-width: 1440px !important;
    margin: 0 auto !important;
    padding: 28px 30px 46px !important;
}
body.admin-dashboard-page .admin-breadcrumb {
    display: none !important;
}

/* Convert the Admin dashboard hero from a large card into the canonical
   open page heading while keeping the dashboard data/cards below untouched. */
body.admin-dashboard-page .admin-hero-card {
    position: relative !important;
    overflow: visible !important;
    min-height: 0 !important;
    margin: 0 0 24px !important;
    padding: 0 !important;
    display: flex !important;
    align-items: flex-end !important;
    justify-content: space-between !important;
    gap: 24px !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
}
body.admin-dashboard-page .admin-hero-card::after {
    display: none !important;
    content: none !important;
}
body.admin-dashboard-page .admin-hero-copy {
    min-width: 0;
}
body.admin-dashboard-page .admin-hero-copy > p:not(.admin-hero-description) {
    display: none !important;
}
body.admin-dashboard-page .admin-hero-copy .admin-hero-description {
    display: block !important;
    margin-top: 7px !important;
}

/* Shared dashboard date + live clock presentation. */
body.student-dashboard-page .student-dashboard-greeting,
body.supervisor-dashboard-page .supervisor-heading-row > .text-end,
body.admin-dashboard-page .admin-hero-status.nx-dashboard-live-clock {
    flex: 0 0 auto !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    text-align: right !important;
}
body.student-dashboard-page .student-dashboard-greeting-copy strong,
body.supervisor-dashboard-page .supervisor-heading-row > .text-end > strong,
body.admin-dashboard-page .admin-hero-status.nx-dashboard-live-clock strong {
    display: block !important;
    margin: 0 !important;
    color: var(--nx-page-heading-ink, #10261d) !important;
    font-size: 1rem !important;
    line-height: 1.25 !important;
    font-weight: 800 !important;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
body.student-dashboard-page .student-dashboard-greeting-copy span,
body.supervisor-dashboard-page .supervisor-heading-row > .text-end > span,
body.admin-dashboard-page .admin-hero-status.nx-dashboard-live-clock span {
    display: block !important;
    margin: 5px 0 0 !important;
    color: var(--nx-page-heading-muted, #718078) !important;
    font-size: 0.78rem !important;
    line-height: 1.3 !important;
    font-weight: 700 !important;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    white-space: nowrap;
}

@media (max-width: 680px) {
    body.student-page .student-section-heading,
    body.supervisor-dashboard-page .supervisor-heading-row,
    body.work-page .supervisor-classwork-heading,
    body.supervisor-page .sp-heading,
    body.supervisor-classes-page .supervisor-classes-header,
    body.nexora-admin-body .students-page-header,
    body.nexora-admin-body .supervisors-page-header,
    body.nexora-admin-body .dashboard-header,
    body.admin-page .ui-page-heading,
    body.nx-notifications-page .nx-notifications-heading,
    body.admin-dashboard-page .admin-hero-card {
        align-items: flex-start !important;
        flex-direction: column !important;
        gap: 12px !important;
    }

    body.student-page .student-section-heading h1,
    body.student-documents-page .student-documents-title h1,
    body.supervisor-dashboard-page .supervisor-dashboard-heading h1,
    body.work-page .supervisor-classwork-heading h1,
    body.supervisor-page .sp-heading h1,
    body.supervisor-classes-page .supervisor-classes-header h1,
    body.nexora-admin-body .students-page-header h1,
    body.nexora-admin-body .supervisors-page-header h1,
    body.nexora-admin-body .dashboard-header h1,
    body.admin-dashboard-page .admin-hero-card h1,
    body.admin-documents-page .admin-documents-title h1,
    body.admin-page .ui-page-heading h1,
    body.nx-notifications-page .nx-notifications-heading h1 {
        font-size: 1.65rem !important;
    }

    body.admin-dashboard-page .admin-main {
        padding-top: 64px !important;
    }
    body.admin-dashboard-page .admin-dashboard-content {
        padding: 22px 16px 36px !important;
    }
    body.student-dashboard-page .student-dashboard-greeting,
    body.supervisor-dashboard-page .supervisor-heading-row > .text-end,
    body.admin-dashboard-page .admin-hero-status.nx-dashboard-live-clock {
        text-align: left !important;
    }
}
</style>

<script>
(function () {
    function mountLiveClock(dateNode, timeNode) {
        if (!dateNode || !timeNode || dateNode.dataset.nxClockMounted === 'true') return;

        dateNode.dataset.nxClockMounted = 'true';

        var dateFormatter = new Intl.DateTimeFormat('en-US', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });
        var timeFormatter = new Intl.DateTimeFormat('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });

        function renderClock() {
            var now = new Date();
            dateNode.textContent = dateFormatter.format(now);
            timeNode.textContent = timeFormatter.format(now);
        }

        renderClock();
        var clockTimer = window.setInterval(renderClock, 1000);
        window.addEventListener('pagehide', function () {
            window.clearInterval(clockTimer);
        }, {once: true});
    }

    function applyCanonicalDashboardHeadings() {
        if (document.body.classList.contains('student-dashboard-page')) {
            var studentDate = document.getElementById('dashboard-current-date');
            var studentTime = studentDate ? studentDate.nextElementSibling : null;
            var studentGreeting = studentDate ? studentDate.closest('.student-dashboard-greeting') : null;
            if (studentGreeting) studentGreeting.setAttribute('aria-label', 'Current date and time');
            mountLiveClock(studentDate, studentTime);
        }

        if (document.body.classList.contains('supervisor-dashboard-page')) {
            var supervisorEyebrow = document.querySelector('.supervisor-dashboard-heading .supervisor-breadcrumb');
            if (supervisorEyebrow) supervisorEyebrow.textContent = 'SUPERVISOR DASHBOARD';

            var supervisorDate = document.getElementById('supervisor-dashboard-date');
            var supervisorTime = supervisorDate ? supervisorDate.nextElementSibling : null;
            var supervisorClock = supervisorDate ? supervisorDate.parentElement : null;
            if (supervisorClock) supervisorClock.setAttribute('aria-label', 'Current date and time');
            mountLiveClock(supervisorDate, supervisorTime);
        }

        if (document.body.classList.contains('admin-dashboard-page')) {
            var adminEyebrow = document.querySelector('.admin-hero-card .admin-eyebrow');
            if (adminEyebrow) adminEyebrow.textContent = 'ADMIN DASHBOARD';

            var adminClock = document.querySelector('.admin-hero-status');
            if (adminClock && !adminClock.classList.contains('nx-dashboard-live-clock')) {
                adminClock.classList.add('nx-dashboard-live-clock');
                adminClock.setAttribute('aria-label', 'Current date and time');
                adminClock.innerHTML = '<div><strong data-nx-admin-date>Today</strong><span data-nx-admin-time>--:--:--</span></div>';
            }

            var adminDate = adminClock ? adminClock.querySelector('[data-nx-admin-date]') : null;
            var adminTime = adminClock ? adminClock.querySelector('[data-nx-admin-time]') : null;
            mountLiveClock(adminDate, adminTime);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyCanonicalDashboardHeadings, {once: true});
    } else {
        applyCanonicalDashboardHeadings();
    }
})();
</script>
