    --nx-page-heading-ink: #17233b;
    --nx-page-heading-muted: #64748b;
}

    --nx-page-heading-ink: #10251f;
    --nx-page-heading-muted: #6c7d78;

    body.student-page .student-section-heading h1,
    body.student-documents-page .student-documents-title h1,
    body.supervisor-dashboard-page .supervisor-dashboard-heading h1,
    body.work-page .supervisor-classwork-heading h1,
    body.supervisor-page .sp-heading h1,
    body.supervisor-classes-page .supervisor-classes-header h1,
    body.nexora-admin-body .students-page-header h1,
    body.nexora-admin-body .supervisors-page-header h1,
    body.nexora-admin-body .dashboard-header h1,
    body.admin-dashboard-page .admin-hero-card h1,
    body.admin-documents-page .admin-documents-title h1,
    body.admin-page .ui-page-heading h1,
    body.nx-notifications-page .nx-notifications-heading h1 {
        font-size: 1.65rem !important;
    }
}
</style>

{% if nx_topbar_role|default('') == 'student' %}
<script>
(function () {
    function startStudentDashboardClock() {
        if (!document.body.classList.contains('student-dashboard-page')) return;

        var dateNode = document.getElementById('dashboard-current-date');
        if (!dateNode) return;

        var timeNode = dateNode.nextElementSibling;
        if (!timeNode) return;

        var greeting = dateNode.closest('.student-dashboard-greeting');
        if (greeting) greeting.setAttribute('aria-label', 'Current date and time');

        var dateFormatter = new Intl.DateTimeFormat('en-US', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });
        var timeFormatter = new Intl.DateTimeFormat('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });

        function renderClock() {
            var now = new Date();
            dateNode.textContent = dateFormatter.format(now);
            timeNode.textContent = timeFormatter.format(now);
        }

        renderClock();
        var clockTimer = window.setInterval(renderClock, 1000);
        window.addEventListener('pagehide', function () {
            window.clearInterval(clockTimer);
        }, {once: true});
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startStudentDashboardClock, {once: true});
    } else {
        startStudentDashboardClock();
    }
})();
</script>
{% endif %}
