{# Student-only classmate mention picker for the existing Nexora Assistant. #}
<script>
(function(){
    var bootAttempts=0;

    function bootClassmatePicker(){
        var root=document.getElementById('nxAssistant');
        var panel=document.getElementById('nxAssistantPanel');
        var input=document.getElementById('nxAssistantInput');
        var composer=root&&root.querySelector('.nx-assistant-composer');
        if(!root||!panel||!input||!composer){
            if(bootAttempts++<10)window.setTimeout(bootClassmatePicker,120);
            return;
        }
        if(root.dataset.classmatePickerReady==='1')return;
        root.dataset.classmatePickerReady='1';

        var defaultAvatar={{ url_for('static',filename='images/default_profile.png')|tojson }};
        var contacts=[];
        var loaded=false;
        var loading=false;
        var activeIndex=0;
        var visibleContacts=[];

        var picker=document.createElement('div');
        picker.className='nx-classmate-picker';
        picker.id='nxClassmatePicker';
        picker.setAttribute('role','listbox');
        picker.setAttribute('aria-label','Classmates');
        composer.appendChild(picker);

        function hidePicker(){
            picker.classList.remove('is-visible');
            picker.innerHTML='';
            visibleContacts=[];
            activeIndex=0;
            input.removeAttribute('aria-activedescendant');
        }

        function mentionQuery(){
            if(panel.classList.contains('is-live-thread'))return null;
            var value=String(input.value||'');
            if(value.charAt(0)!=='@'||value.indexOf('\n')!==-1)return null;
            return value.slice(1).trim().toLowerCase();
        }

        function classroomLabel(contact){
            var classrooms=contact&&contact.shared_classrooms||[];
            if(!classrooms.length)return 'Classmate · @'+(contact.username||'student');
            var first=classrooms[0]||{};
            var label=String(first.name||'Classroom');
            if(first.section)label+=' · '+first.section;
            if(classrooms.length>1)label+=' +'+String(classrooms.length-1)+' more';
            return label+' · @'+(contact.username||'student');
        }

        function openClassmate(contact){
            if(!contact||!contact.id)return;
            window.sessionStorage.setItem('nxAssistantActiveContact',String(contact.id));
            window.location.assign('/messages/open/'+encodeURIComponent(contact.id));
        }

        function setActive(index){
            if(!visibleContacts.length)return;
            activeIndex=(index+visibleContacts.length)%visibleContacts.length;
            picker.querySelectorAll('.nx-classmate-picker-item').forEach(function(item,itemIndex){
                var active=itemIndex===activeIndex;
                item.classList.toggle('is-active',active);
                item.setAttribute('aria-selected',active?'true':'false');
                if(active){
                    input.setAttribute('aria-activedescendant',item.id);
                    item.scrollIntoView({block:'nearest'});
                }
            });
        }

        function render(query){
            var normalized=String(query||'').toLowerCase();
            visibleContacts=contacts.filter(function(contact){
                var classrooms=(contact.shared_classrooms||[]).map(function(classroom){
                    return (String(classroom.name||'')+' '+String(classroom.section||'')).toLowerCase();
                }).join(' ');
                var haystack=(String(contact.display_name||'')+' '+String(contact.username||'')+' '+classrooms).toLowerCase();
                return !normalized||haystack.indexOf(normalized)!==-1;
            }).slice(0,12);

            picker.innerHTML='';
            var head=document.createElement('div');
            head.className='nx-classmate-picker-head';
            head.textContent='Classmates';
            picker.appendChild(head);

            if(!visibleContacts.length){
                var empty=document.createElement('div');
                empty.className='nx-classmate-picker-empty';
                empty.textContent=loaded?'No classmates match that name.':'Loading classmates…';
                picker.appendChild(empty);
                picker.classList.add('is-visible');
                return;
            }

            visibleContacts.forEach(function(contact,index){
                var button=document.createElement('button');
                button.type='button';
                button.className='nx-classmate-picker-item';
                button.id='nxClassmateOption'+String(contact.id);
                button.setAttribute('role','option');
                button.setAttribute('aria-selected','false');

                var image=document.createElement('img');
                image.src=contact.avatar_url||defaultAvatar;
                image.alt='';
                image.addEventListener('error',function(){if(image.src!==defaultAvatar)image.src=defaultAvatar;},{once:true});

                var copy=document.createElement('span');
                copy.className='nx-classmate-picker-copy';
                var name=document.createElement('strong');
                name.textContent=contact.display_name||contact.username||'Classmate';
                var detail=document.createElement('small');
                detail.textContent=classroomLabel(contact);
                copy.appendChild(name);
                copy.appendChild(detail);

                button.appendChild(image);
                button.appendChild(copy);
                button.addEventListener('mouseenter',function(){setActive(index);});
                button.addEventListener('click',function(){openClassmate(contact);});
                picker.appendChild(button);
            });

            picker.classList.add('is-visible');
            setActive(Math.min(activeIndex,visibleContacts.length-1));
        }

        function loadClassmates(query){
            if(loaded){render(query);return;}
            if(loading)return;
            loading=true;
            render(query);
            fetch('/messages/contacts?role=student',{headers:{Accept:'application/json'},cache:'no-store'})
                .then(function(response){return response.json().then(function(data){if(!response.ok||data.ok===false)throw new Error(data.error||'Unable to load classmates.');return data;});})
                .then(function(data){contacts=(data.contacts||[]).filter(function(contact){return contact.role==='student';});loaded=true;})
                .catch(function(){contacts=[];loaded=true;})
                .finally(function(){loading=false;var current=mentionQuery();if(current!==null)render(current);});
        }

        function refreshPicker(){
            var query=mentionQuery();
            if(query===null){hidePicker();return;}
            loadClassmates(query);
        }

        input.addEventListener('input',refreshPicker);
        input.addEventListener('focus',refreshPicker);
        input.addEventListener('keydown',function(event){
            if(!picker.classList.contains('is-visible'))return;
            if(event.key==='ArrowDown'){
                event.preventDefault();
                event.stopImmediatePropagation();
                setActive(activeIndex+1);
            }else if(event.key==='ArrowUp'){
                event.preventDefault();
                event.stopImmediatePropagation();
                setActive(activeIndex-1);
            }else if(event.key==='Enter'&&!event.shiftKey&&visibleContacts.length){
                event.preventDefault();
                event.stopImmediatePropagation();
                openClassmate(visibleContacts[activeIndex]||visibleContacts[0]);
            }else if(event.key==='Escape'){
                event.preventDefault();
                event.stopImmediatePropagation();
                hidePicker();
            }
        },true);

        document.addEventListener('mousedown',function(event){
            if(!picker.contains(event.target)&&event.target!==input)hidePicker();
        });
    }

    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',function(){window.setTimeout(bootClassmatePicker,180);},{once:true});
    }else{
        window.setTimeout(bootClassmatePicker,180);
    }
})();
</script>
