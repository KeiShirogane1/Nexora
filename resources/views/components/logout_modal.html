{% if session.get('role') == 'admin' %}
    {% include 'components/admin_consistency.html' %}
{% endif %}

<style id="nx-global-close-copy-consistency">
/* Global close buttons: show only the X, no permanent box. */
.nexora-modal-close,
.modal-close,
.nexora-logout-close,
.crop-close,
#nxDocumentViewerClose,
button[aria-label="Close"],
button[aria-label^="Close "] {
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    color: #64748b !important;
}
.nexora-modal-close:hover,
.modal-close:hover,
.nexora-logout-close:hover,
.crop-close:hover,
#nxDocumentViewerClose:hover,
button[aria-label="Close"]:hover,
button[aria-label^="Close "]:hover {
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    color: #dc2626 !important;
}
.nexora-modal-close:active,
.modal-close:active,
.nexora-logout-close:active,
.crop-close:active,
#nxDocumentViewerClose:active,
button[aria-label="Close"]:active,
button[aria-label^="Close "]:active {
    background: transparent !important;
    color: #991b1b !important;
}
.nexora-modal-close:focus-visible,
.modal-close:focus-visible,
.nexora-logout-close:focus-visible,
.crop-close:focus-visible,
#nxDocumentViewerClose:focus-visible,
button[aria-label="Close"]:focus-visible,
button[aria-label^="Close "]:focus-visible {
    outline: 2px solid rgba(220, 38, 38, .32) !important;
    outline-offset: 2px !important;
}

/* Username copy control: icon-only and visually aligned with username text. */
.nx-copy-username {
    width: auto !important;
    height: auto !important;
    min-width: 0 !important;
    min-height: 0 !important;
    padding: 0 1px !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    color: inherit !important;
    display: inline-grid !important;
    place-items: center !important;
    line-height: 1 !important;
    vertical-align: middle !important;
}
.nx-copy-username:hover {
    border: 0 !important;
    background: transparent !important;
    color: inherit !important;
    opacity: .72;
}
.nx-copy-username:active { opacity: .5; }
.nx-copy-username svg {
    width: 1em !important;
    height: 1em !important;
    display: block !important;
}

/* Admin document pages reuse the Supervisor document geometry, not its blue page tint. */
body.admin-documents-role,
body.admin-documents-role .supervisor-documents-page,
body.admin-documents-role .supervisor-document-folder-page {
    background: #fff8f5 !important;
}
body.admin-documents-role .supervisor-doc-filter-grid {
    grid-template-columns: minmax(260px, 1fr) 210px auto !important;
}
@media (max-width: 1050px) {
    body.admin-documents-role .supervisor-doc-filter-grid {
        grid-template-columns: 1fr 1fr !important;
    }
    body.admin-documents-role .supervisor-doc-filter-grid input {
        grid-column: 1 / -1 !important;
    }
}
@media (max-width: 760px) {
    body.admin-documents-role .supervisor-doc-filter-grid {
        grid-template-columns: 1fr !important;
    }
    body.admin-documents-role .supervisor-doc-filter-grid input {
        grid-column: auto !important;
    }
}
</style>

<div id="nexora-logout-overlay" class="nexora-logout-overlay" role="dialog" aria-modal="true" aria-labelledby="logout-title">
    <div class="nexora-logout-modal" role="document">
        <div class="nexora-logout-header">
            <h3 id="logout-title">Log out?</h3>
            <button type="button" class="nexora-logout-close" onclick="closeLogoutModal()" aria-label="Close">×</button>
        </div>
        <div class="nexora-logout-footer">
            <button type="button" class="btn-secondary-nexora" onclick="closeLogoutModal()">Cancel</button>
            <a href="{{ url_for('auth.logout') }}" class="btn-danger-nexora">Log out</a>
        </div>
    </div>
</div>

<script>
(function () {
    window.openLogoutModal = function () {
        const el = document.getElementById("nexora-logout-overlay");
        if (el) { el.classList.add("open"); document.body.style.overflow = "hidden"; }
    };
    window.closeLogoutModal = function () {
        const el = document.getElementById("nexora-logout-overlay");
        if (el) { el.classList.remove("open"); document.body.style.overflow = ""; }
    };
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLogoutModal(); });
    document.addEventListener("click", function (e) {
        const overlay = document.getElementById("nexora-logout-overlay");
        if (overlay && e.target === overlay) closeLogoutModal();
    });

    function removeDuplicateClassInfoMenuAction() {
        document.querySelectorAll('.class-banner-menu-panel .class-banner-menu-item').forEach(function (button) {
            var label = String(button.textContent || '').replace(/\s+/g, ' ').trim();
            if (label === 'ⓘ Classroom Information' || label === 'Classroom Information') button.remove();
        });
    }

    function normalizeKnownProgram(value) {
        var text = String(value || '').trim();
        var aliases = {
            'bsit': 'Bachelor of Science in Information Technology',
            'bs information technology': 'Bachelor of Science in Information Technology',
            'bs in information technology': 'Bachelor of Science in Information Technology',
            'bachelor of science in information technology': 'Bachelor of Science in Information Technology',
            'bscs': 'Bachelor of Science in Computer Science',
            'bs computer science': 'Bachelor of Science in Computer Science',
            'bs in computer science': 'Bachelor of Science in Computer Science',
            'bachelor of science in computer science': 'Bachelor of Science in Computer Science',
            'bsis': 'Bachelor of Science in Information Systems',
            'bs information systems': 'Bachelor of Science in Information Systems',
            'bs in information systems': 'Bachelor of Science in Information Systems',
            'bachelor of science in information systems': 'Bachelor of Science in Information Systems',
            'bscpe': 'Bachelor of Science in Computer Engineering',
            'bscpe.': 'Bachelor of Science in Computer Engineering',
            'bs computer engineering': 'Bachelor of Science in Computer Engineering',
            'bs in computer engineering': 'Bachelor of Science in Computer Engineering',
            'bachelor of science in computer engineering': 'Bachelor of Science in Computer Engineering'
        };
        return aliases[text.toLowerCase()] || text;
    }

    function preserveActualAdminProgramLabels() {
        if (window.location.pathname !== '/admin/users/students') return;
        window.setTimeout(function () {
            var rows = Array.from(document.querySelectorAll('#studentsTable tbody tr[data-program]'));
            var programs = [];
            rows.forEach(function (row) {
                var cells = row.querySelectorAll('td');
                var raw = cells.length > 5 ? String(cells[5].textContent || '').trim() : '';
                if (!raw || raw === '—') return;
                var program = normalizeKnownProgram(raw);
                row.setAttribute('data-program', program.toLowerCase());
                if (!programs.some(function (item) { return item.toLowerCase() === program.toLowerCase(); })) programs.push(program);
            });
            programs.sort(function (a, b) { return a.localeCompare(b); });

            var filter = document.getElementById('programFilter');
            if (filter) {
                filter.innerHTML = '<option value="all">All Programs</option>';
                programs.forEach(function (program) {
                    var option = document.createElement('option');
                    option.value = program.toLowerCase();
                    option.textContent = program;
                    filter.appendChild(option);
                });
            }

            var createSelect = document.getElementById('studentProgram');
            if (createSelect) {
                var custom = Array.from(createSelect.options).find(function (option) { return option.value === '__custom__'; });
                createSelect.innerHTML = '<option value="" disabled selected>Select Program</option>';
                programs.forEach(function (program) {
                    var option = document.createElement('option');
                    option.value = program;
                    option.textContent = program;
                    createSelect.appendChild(option);
                });
                if (custom) createSelect.appendChild(custom);
                else {
                    var customOption = document.createElement('option');
                    customOption.value = '__custom__';
                    customOption.textContent = 'Other / Specify Program';
                    createSelect.appendChild(customOption);
                }
            }
        }, 0);
    }

    function applySharedPolish() {
        removeDuplicateClassInfoMenuAction();
        preserveActualAdminProgramLabels();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applySharedPolish);
    } else {
        applySharedPolish();
    }
})();
</script>
