<script id="nx-desktop-mobile-viewport">
(function () {
    if (window.__nexoraDesktopMobileViewport) return;

    var isTouchDevice = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    var screenWidth = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
    var screenHeight = window.screen && window.screen.height ? window.screen.height : window.innerHeight;
    var shortEdge = Math.min(screenWidth || 9999, screenHeight || 9999);

    if (!isTouchDevice || shortEdge > 900) return;

    var desktopWidth = 1180;
    var visualWidth = window.innerWidth || screenWidth || 360;
    var scale = Math.max(0.25, Math.min(1, visualWidth / desktopWidth));
    var viewport = document.querySelector('meta[name="viewport"]');

    if (!viewport) {
        viewport = document.createElement('meta');
        viewport.name = 'viewport';
        document.head.appendChild(viewport);
    }

    viewport.setAttribute(
        'content',
        'width=' + desktopWidth +
        ', initial-scale=' + scale.toFixed(3) +
        ', minimum-scale=0.25, maximum-scale=5, user-scalable=yes'
    );

    window.__nexoraDesktopMobileViewport = true;
})();
</script>

{# Shared looping background for Nexora authentication screens. #}
<style>
    body.general-page {
        position: relative;
        isolation: isolate;
        overflow-x: hidden;
    }

    .nexora-auth-loop-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: #071d17 url("{{ url_for('static', filename='images/Nexora Login.png') }}") center center / cover no-repeat;
    }

    .nexora-auth-loop-bg video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        transform: none;
        filter: none;
    }

    .nexora-auth-loop-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 34%, rgba(11, 106, 72, .06), transparent 42%),
            linear-gradient(180deg, rgba(2, 24, 17, .24), rgba(2, 21, 15, .44));
    }

    body.general-page > .login-container {
        position: relative;
        z-index: 2;
        background: rgba(255, 255, 255, .965);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }
</style>

<div class="nexora-auth-loop-bg" aria-hidden="true">
    <video id="nexoraAuthLoopVideo" autoplay muted loop playsinline preload="auto" poster="{{ url_for('static', filename='images/Nexora Login.png') }}">
        <source src="{{ url_for('static', filename='videos/nexora_auth_background.mp4') }}?v=20260914-smooth24" type="video/mp4">
    </video>
</div>

<script>
(function () {
    var video = document.getElementById('nexoraAuthLoopVideo');
    if (!video) return;

    video.muted = true;
    video.loop = true;

    function keepPlaying() {
        if (document.hidden) return;
        var playAttempt = video.play();
        if (playAttempt && typeof playAttempt.catch === 'function') {
            playAttempt.catch(function () {});
        }
    }

    video.addEventListener('ended', function () {
        video.currentTime = 0;
        keepPlaying();
    });
    video.addEventListener('canplay', keepPlaying, {once: true});
    video.addEventListener('pause', function () {
        if (!document.hidden) keepPlaying();
    });
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) keepPlaying();
    });
    window.addEventListener('focus', keepPlaying);

    keepPlaying();
})();
</script>
