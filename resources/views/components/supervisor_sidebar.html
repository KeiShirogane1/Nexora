<link rel="stylesheet" href="{{ url_for('static', filename='css/nexora-ui.css') }}">
<aside class="supervisor-sidebar compact-sidebar" id="mainSidebar">
    <div class="sidebar-header">
        <button class="hamburger-btn sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <a class="sidebar-brand" href="{{ url_for('supervisor.supervisor_dashboard') }}" aria-label="Nexora home"><img src="{{ url_for('static', filename='images/Nexora.png') }}" alt="Nexora"><span>Nexora</span></a>
    </div>
    <a href="{{ url_for('supervisor.supervisor_profile') }}" class="sidebar-profile text-center" style="text-decoration:none;color:inherit;display:block;">
        <img src="{{ url_for('static', filename='images/default_profile.png') }}" alt="Profile Picture" class="sidebar-profile-image">
        <h5 class="mt-2 mb-1">Supervisor</h5><small class="text-muted">View profile</small>
    </a>
    <ul class="sidebar-menu">
        <li><a href="{{ url_for('supervisor.supervisor_dashboard') }}" class="{% if active_page == 'dashboard' %}active{% endif %}"><span class="nav-icon">🏠</span><span>Dashboard</span></a></li>
        <li><a href="{{ url_for('supervisor.view_interns') }}" class="{% if active_page == 'interns' %}active{% endif %}"><span class="nav-icon">👥</span><span>Assigned Interns</span></a></li>
        <li><a href="{{ url_for('classroom.supervisor_classes') }}" class="{% if active_page == 'classes' %}active{% endif %}"><span class="nav-icon">🏫</span><span>My Classes</span></a></li>
        <li><a href="{{ url_for('notifications.notification_list') }}" class="{% if request.path == '/notifications' %}active{% endif %}"><span class="nav-icon">🔔</span><span>Notifications</span>{% if unread_count %}<span class="sidebar-notification-badge">{{ unread_count }}</span>{% endif %}</a></li>
        <li class="sidebar-menu-divider"><a href="javascript:void(0)" class="logout-link" onclick="openLogoutModal(); return false;"><span class="nav-icon">🚪</span><span>Logout</span></a></li>
    </ul>
</aside>
{% include 'components/logout_modal.html' %}
{% include 'components/toast.html' %}
{% include 'components/notification_bell.html' %}
