<aside class="supervisor-sidebar compact-sidebar" id="mainSidebar">
<!-- HEADER -->
    <div class="sidebar-header">
        <button class="hamburger-btn sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <div class="sidebar-brand">
            <img src="{{ url_for('static', filename='images/Nexora Light.png') }}" alt="Nexora">
            <span>Nexora</span>
        </div>
    </div>

    <!-- PROFILE SECTION — clickable -->
    <a href="/supervisor/dashboard" class="sidebar-profile text-center" style="text-decoration:none; color:inherit; display:block;">
        <img src="{{ url_for('static', filename='images/default_profile.png') }}" alt="Profile Picture" class="sidebar-profile-image">
        <h5 class="mt-2 mb-1">Supervisor</h5>
        <small class="text-muted">View dashboard</small>
    </a>

    <!-- NAVIGATION -->
    <ul class="sidebar-menu">
        <li class="{% if active_page == 'dashboard' %}active{% endif %}">
            <a href="/supervisor/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">
                <span class="nav-icon">🏠</span><span>Dashboard</span>
            </a>
        </li>
        <li class="{% if active_page == 'interns' %}active{% endif %}">
            <a href="/supervisor/interns" class="{% if active_page == 'interns' %}active{% endif %}">
                <span class="nav-icon">👥</span><span>Assigned Interns</span>
            </a>
        </li>
        <li class="{% if active_page == 'classes' %}active{% endif %}">
            <a href="{{ url_for('classroom.supervisor_classes') }}" class="{% if active_page == 'classes' %}active{% endif %}">
                <span class="nav-icon">🏫</span><span>My Classes</span>
            </a>
        </li>
        <li>
            <a href="javascript:void(0)" onclick="document.getElementById('notifDropdown')?.classList.toggle('show');">
                <span class="nav-icon">🔔</span><span>Notifications</span>
                {% if unread_count %}<span class="badge bg-danger ms-2">{{ unread_count }}</span>{% endif %}
            </a>
        </li>
        <li style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.12); padding-top:12px;">
            <a href="javascript:void(0)" style="color:#fecaca; font-weight:700;" onclick="openLogoutModal(); return false;">
                <span class="nav-icon">🚪</span><span>Logout</span>
            </a>
        </li>
    </ul>
</aside>
{% include 'components/logout_modal.html' %}
{% include 'components/toast.html' %}
<script>
// Mobile handling for supervisor sidebar
(function(){
    const sidebar = document.getElementById('mainSidebar') || document.querySelector('.supervisor-sidebar');
    if(!sidebar) return;
    const toggles = document.querySelectorAll('.sidebar-toggle');
    toggles.forEach(btn => {
        btn.addEventListener('click', function(){
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
            } else {
                sidebar.classList.toggle('closed');
                document.body.classList.toggle('sidebar-collapsed');
            }
        });
    });
    document.addEventListener('click', function(e){
        if (window.innerWidth <= 768 && sidebar.classList.contains('mobile-open') && !sidebar.contains(e.target) && !e.target.closest('.sidebar-toggle')) {
            sidebar.classList.remove('mobile-open');
        }
    });
})();
</script>
