{# Shared Nexora portal typography for Student, Supervisor, and Admin. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

{% if nx_topbar_role|default('') == 'admin' %}
{% include 'components/admin_management_responsive.html' %}

<script>
document.addEventListener("click", (event) => {
    const button = event.target.closest(".btn-more");
    if (!button) return;
    if (!document.body.classList.contains("admin-students-page") && !document.body.classList.contains("admin-supervisors-page")) return;

    requestAnimationFrame(() => {
        const wrapper = button.closest(".more-actions");
        const menu = wrapper ? wrapper.querySelector(".dropdown-menu-nexora.show") : null;
        if (!menu) return;

        menu.classList.remove("nx-drop-up");
        const menuRect = menu.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();
        const viewportPadding = 16;
        const roomBelow = window.innerHeight - buttonRect.bottom - viewportPadding;
        const roomAbove = buttonRect.top - viewportPadding;

        if (menuRect.height > roomBelow && roomAbove > roomBelow) {
            menu.classList.add("nx-drop-up");
        }
    });
});
</script>
{% endif %}
