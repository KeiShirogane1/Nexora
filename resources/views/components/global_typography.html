{# Shared Nexora portal typography for Student, Supervisor, and Admin. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style id="nx-global-typography">
:root {
    --nexora-font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body:has(.nx-role-sidebar-shell),
body:has(.nx-role-sidebar-shell) *:not(code):not(pre):not(kbd):not(samp) {
    font-family: var(--nexora-font-family) !important;
}

/* Retire legacy portal page artwork while keeping auth/welcome backgrounds intact. */
body:has(.nx-role-sidebar-shell).content-page,
body:has(.nx-role-sidebar-shell).work-page,
body:has(.nx-role-sidebar-shell).analytics-aesthetic,
body:has(.nx-role-sidebar-shell).deeper-metrics,
body:has(.nx-role-sidebar-shell).report-page {
    background: #f5f7fb !important;
    background-image: none !important;
    background-attachment: scroll !important;
}

body:has(.nx-role-sidebar-shell) code,
body:has(.nx-role-sidebar-shell) pre,
body:has(.nx-role-sidebar-shell) kbd,
body:has(.nx-role-sidebar-shell) samp,
body:has(.nx-role-sidebar-shell) :is(code, pre, kbd, samp) * {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
}
</style>

{% if nx_topbar_role|default('') == 'admin' %}
<style id="nx-admin-fluid-shell">
/*
   Keep every Admin page aligned to the same viewport gutters as the Command Center.
   The shared sidebar still owns the 76px desktop rail; these rules only remove
   legacy centered/max-width page shells inside the remaining Admin workspace.
*/
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) {
    --nx-admin-fluid-gutter: 28px;
}

body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nexora-app-main,
body.notification-role-admin:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nx-notifications-main {
    padding-left: var(--nx-admin-fluid-gutter) !important;
    padding-right: var(--nx-admin-fluid-gutter) !important;
    box-sizing: border-box !important;
}

body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > :first-child,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .nexora-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container-fluid,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .compact-dashboard,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-command-center,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-dashboard-content,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-documents-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-document-folder-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-report-page-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-insights-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-polish-page,
body.notification-role-admin:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nx-notifications-wrap {
    width: 100% !important;
    max-width: none !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    box-sizing: border-box !important;
}

body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .nexora-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container-fluid,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .compact-dashboard,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-command-center,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-dashboard-content,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-documents-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-document-folder-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-report-page-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-insights-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-polish-page,
body.notification-role-admin:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nx-notifications-wrap {
    padding-left: 0 !important;
    padding-right: 0 !important;
}

@media (max-width: 900px) {
    body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) {
        --nx-admin-fluid-gutter: 20px;
    }
}

@media (max-width: 760px) {
    body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) {
        --nx-admin-fluid-gutter: 16px;
    }
}
</style>

    {% include 'components/admin_management_responsive.html' %}

<style id="nx-admin-directory-actions-grid">
@media (min-width: 1280px) {
    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn),
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) {
        width: 100% !important;
        min-width: 0 !important;
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 38px;
        grid-template-rows: repeat(2, minmax(36px, auto));
        gap: 6px 8px !important;
        align-items: stretch !important;
        justify-content: stretch !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .btn-view,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .btn-view {
        grid-column: 1;
        grid-row: 1;
        width: 100% !important;
        min-width: 0 !important;
        justify-content: center !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .nx-quick-chat-btn,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .nx-quick-chat-btn {
        grid-column: 1;
        grid-row: 2;
        width: 100% !important;
        min-width: 0 !important;
        justify-content: center !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .more-actions,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .more-actions {
        grid-column: 2;
        grid-row: 1;
        align-self: stretch;
        display: flex !important;
        align-items: stretch !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .btn-more,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .btn-more {
        width: 38px !important;
        height: 100% !important;
        min-height: 36px !important;
        font-size: 20px !important;
        line-height: 1 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
}
</style>
{% endif %}
