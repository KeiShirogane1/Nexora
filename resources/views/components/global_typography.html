{# Shared Nexora portal typography for Student, Supervisor, and Admin. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style id="nx-global-typography">
:root {
    --nexora-font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body:has(.nx-role-sidebar-shell),
body:has(.nx-role-sidebar-shell) *:not(code):not(pre):not(kbd):not(samp) {
    font-family: var(--nexora-font-family) !important;
}

/* Retire legacy portal page artwork while keeping auth/welcome backgrounds intact. */
body:has(.nx-role-sidebar-shell).content-page,
body:has(.nx-role-sidebar-shell).work-page,
body:has(.nx-role-sidebar-shell).analytics-aesthetic,
body:has(.nx-role-sidebar-shell).deeper-metrics,
body:has(.nx-role-sidebar-shell).report-page {
    background: #f5f7fb !important;
    background-image: none !important;
    background-attachment: scroll !important;
}

body:has(.nx-role-sidebar-shell) code,
body:has(.nx-role-sidebar-shell) pre,
body:has(.nx-role-sidebar-shell) kbd,
body:has(.nx-role-sidebar-shell) samp,
body:has(.nx-role-sidebar-shell) :is(code, pre, kbd, samp) * {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
}
</style>

{% if nx_topbar_role|default('') == 'admin' %}
<style id="nx-admin-fluid-shell">
/*
   Keep every Admin page aligned to the same viewport gutters as the Command Center.
   The shared sidebar still owns the 76px desktop rail; these rules only remove
   legacy centered/max-width page shells inside the remaining Admin workspace.
*/
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) {
    --nx-admin-fluid-gutter: 28px;
}

body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nexora-app-main,
body.notification-role-admin:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nx-notifications-main {
    padding-left: var(--nx-admin-fluid-gutter) !important;
    padding-right: var(--nx-admin-fluid-gutter) !important;
    box-sizing: border-box !important;
}

body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > :first-child,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .nexora-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container-fluid,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .compact-dashboard,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-command-center,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-dashboard-content,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-documents-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-document-folder-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-report-page-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-insights-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-polish-page,
body.notification-role-admin:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nx-notifications-wrap {
    width: 100% !important;
    max-width: none !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    box-sizing: border-box !important;
}

body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .nexora-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .container-fluid,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .compact-dashboard,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-command-center,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-dashboard-content,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-documents-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-document-folder-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-report-page-shell,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-insights-page,
body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .admin-main > .admin-polish-page,
body.notification-role-admin:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) .nx-notifications-wrap {
    padding-left: 0 !important;
    padding-right: 0 !important;
}

@media (max-width: 900px) {
    body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) {
        --nx-admin-fluid-gutter: 20px;
    }
}

@media (max-width: 760px) {
    body:has(.nx-role-sidebar-shell.nx-role-admin):has(.nx-role-topbar) {
        --nx-admin-fluid-gutter: 16px;
    }
}
</style>

    {% include 'components/admin_management_responsive.html' %}

<style id="nx-admin-directory-actions-grid">
/* Supervisor directory keeps Email and Program Focus available to filtering/search,
   but removes those secondary columns from the visible management table. */
body.admin-supervisors-page #supervisorsTable th:nth-child(6),
body.admin-supervisors-page #supervisorsTable td:nth-child(6),
body.admin-supervisors-page #supervisorsTable th:nth-child(8),
body.admin-supervisors-page #supervisorsTable td:nth-child(8) {
    display: none !important;
}

body.admin-supervisors-page .table-card-header > div > small.text-muted {
    font-size: 0;
}

body.admin-supervisors-page .table-card-header > div > small.text-muted::after {
    content: "Profile, department, classes, assigned students, and account status.";
    color: #6f7f91;
    font-size: 0.8rem;
    font-weight: 400;
    line-height: 1.45;
}

/* Keep Supervisor Management on the Admin orange/red visual language. */
body.admin-supervisors-page .btn-view {
    background: var(--admin-polish-accent, #f45125) !important;
    border-color: var(--admin-polish-accent, #f45125) !important;
    color: #fff !important;
    box-shadow: 0 2px 8px rgba(244, 81, 37, 0.22) !important;
}

body.admin-supervisors-page .btn-view:hover,
body.admin-supervisors-page .btn-view:focus-visible {
    background: var(--admin-polish-accent-dark, #d9471b) !important;
    border-color: var(--admin-polish-accent-dark, #d9471b) !important;
    color: #fff !important;
}

body.admin-supervisors-page .nx-quick-chat-btn {
    background: #fff !important;
    border-color: #f2a086 !important;
    color: var(--admin-polish-accent-dark, #d9471b) !important;
}

body.admin-supervisors-page .nx-quick-chat-btn:hover,
body.admin-supervisors-page .nx-quick-chat-btn:focus-visible {
    background: #fff7f3 !important;
    border-color: var(--admin-polish-accent, #f45125) !important;
    color: var(--admin-polish-accent-dark, #d9471b) !important;
}

body.admin-supervisors-page #supervisorsTable [data-assigned-students] .badge.bg-primary {
    background: #f7f9fb !important;
    border: 1px solid #e0e5ea !important;
    color: #566577 !important;
}

@media (min-width: 1280px) {
    body.admin-supervisors-page .table-responsive {
        overflow-x: visible !important;
    }

    body.admin-supervisors-page #supervisorsTable {
        width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed !important;
    }

    body.admin-supervisors-page #supervisorsTable th,
    body.admin-supervisors-page #supervisorsTable td {
        min-width: 0 !important;
        padding-left: 9px !important;
        padding-right: 9px !important;
        overflow-wrap: anywhere;
    }

    body.admin-supervisors-page #supervisorsTable th:nth-child(1),
    body.admin-supervisors-page #supervisorsTable td:nth-child(1) { width: 3%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(2),
    body.admin-supervisors-page #supervisorsTable td:nth-child(2) { width: 4%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(3),
    body.admin-supervisors-page #supervisorsTable td:nth-child(3) { width: 18%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(4),
    body.admin-supervisors-page #supervisorsTable td:nth-child(4) { width: 12%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(5),
    body.admin-supervisors-page #supervisorsTable td:nth-child(5) { width: 13%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(7),
    body.admin-supervisors-page #supervisorsTable td:nth-child(7) { width: 16%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(9),
    body.admin-supervisors-page #supervisorsTable td:nth-child(9) { width: 9%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(10),
    body.admin-supervisors-page #supervisorsTable td:nth-child(10) { width: 8%; }
    body.admin-supervisors-page #supervisorsTable th:nth-child(11),
    body.admin-supervisors-page #supervisorsTable td:nth-child(11) { width: 17%; }

    body.admin-supervisors-page .supervisor-cell {
        min-width: 0 !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn),
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) {
        width: 100% !important;
        min-width: 0 !important;
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 38px;
        grid-template-rows: repeat(2, minmax(36px, auto));
        gap: 6px 8px !important;
        align-items: stretch !important;
        justify-content: stretch !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .btn-view,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .btn-view {
        grid-column: 1;
        grid-row: 1;
        width: 100% !important;
        min-width: 0 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .nx-quick-chat-btn,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .nx-quick-chat-btn {
        grid-column: 1;
        grid-row: 2;
        width: 100% !important;
        min-width: 0 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .more-actions,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .more-actions {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: stretch !important;
        position: relative !important;
        display: block !important;
        min-height: 0 !important;
    }

    body.admin-students-page .actions-cell:has(.nx-quick-chat-btn) .btn-more,
    body.admin-supervisors-page .actions-cell:has(.nx-quick-chat-btn) .btn-more {
        position: absolute !important;
        inset: 0 !important;
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        font-size: 20px !important;
        line-height: 1 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
}

@media (min-width: 681px) and (max-width: 1279px) {
    body.admin-supervisors-page #supervisorsTable {
        min-width: 860px !important;
    }
}

@media (max-width: 680px) {
    body.admin-supervisors-page #supervisorsTable {
        min-width: 760px !important;
    }
}
</style>
{% endif %}
