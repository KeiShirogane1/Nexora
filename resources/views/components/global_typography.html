{# Shared Nexora portal typography for Student, Supervisor, and Admin. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style id="nx-global-typography">
:root {
    --nexora-font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body:has(.nx-role-sidebar-shell),
body:has(.nx-role-sidebar-shell) *:not(code):not(pre):not(kbd):not(samp) {
    font-family: var(--nexora-font-family) !important;
}

/* Retire legacy portal page artwork while keeping auth/welcome backgrounds intact. */
body:has(.nx-role-sidebar-shell).content-page,
body:has(.nx-role-sidebar-shell).work-page,
body:has(.nx-role-sidebar-shell).analytics-aesthetic,
body:has(.nx-role-sidebar-shell).deeper-metrics,
body:has(.nx-role-sidebar-shell).report-page {
    background: #f5f7fb !important;
    background-image: none !important;
    background-attachment: scroll !important;
}

body:has(.nx-role-sidebar-shell) code,
body:has(.nx-role-sidebar-shell) pre,
body:has(.nx-role-sidebar-shell) kbd,
body:has(.nx-role-sidebar-shell) samp,
body:has(.nx-role-sidebar-shell) :is(code, pre, kbd, samp) * {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
}
</style>
