<div class="notification-wrapper">
    <button class="notification-button" onclick="toggleNotifications()" aria-label="Notifications">
        🔔
        {% if unread_count > 0 %}
        <span class="notification-count" id="notificationCount">{{ unread_count }}</span>
        {% endif %}
    </button>

    <div id="notificationDropdown" class="notification-dropdown">
        {% if notifications %}
            {% for notif in notifications %}
            <div
                id="notif-{{ notif['id'] }}"
                class="notification-item {% if notif['is_read'] == 0 %}unread{% endif %}"
                onclick="markNotificationRead({{ notif['id'] }}, this)">
                <strong>{{ notif['title'] }}</strong>
                <p>{{ notif['message'] }}</p>
                <small>{{ notif['created_at'] }}</small>
            </div>
            {% endfor %}
            {% if unread_count > 0 %}
            <div class="notification-mark-all">
                <button onclick="markAllRead(event)" class="notification-mark-all-button">Mark all as read</button>
            </div>
            {% endif %}
        {% else %}
            <div class="notification-empty">No notifications</div>
        {% endif %}
    </div>
</div>

<script>
function toggleNotifications(){
    const dropdown = document.getElementById("notificationDropdown");
    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}

function markNotificationRead(notificationId, el){
    fetch("/notification/read/" + notificationId, { method: "POST", headers: {"X-CSRFToken": "{{ csrf_token() }}"} })
    .then(response => {
        if(response.ok){
            if(el) el.classList.remove("unread");
            const countEl = document.getElementById("notificationCount");
            if(countEl){
                let c = parseInt(countEl.textContent) || 0;
                c = Math.max(0, c - 1);
                if(c === 0) countEl.remove();
                else countEl.textContent = c;
            }
        }
    })
    .catch(()=>{});
}

function markAllRead(e){
    if(e) e.stopPropagation();
    fetch("/notifications/read-all", { method: "POST", headers: {"X-CSRFToken": "{{ csrf_token() }}"} })
    .then(r => r.json())
    .then(data => {
        if(data.ok){
            document.querySelectorAll(".notification-item.unread").forEach(el=>el.classList.remove("unread"));
            const c = document.getElementById("notificationCount");
            if(c) c.remove();
        }
    });
}

document.addEventListener("click", function(event){
    const wrapper = document.querySelector(".notification-wrapper");
    const dropdown = document.getElementById("notificationDropdown");
    if(wrapper && !wrapper.contains(event.target)){
        dropdown.style.display="none";
    }
});
</script>
