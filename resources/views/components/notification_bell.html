<style>
.notification-wrapper {
    position: fixed !important;
    top: 20px !important;
    right: 24px !important;
    z-index: 1200 !important;
    width: 52px !important;
    height: 52px !important;
}
.notification-button {
    width: 52px !important;
    height: 52px !important;
    border: 1px solid #e5e7eb !important;
    border-radius: 50% !important;
    background: #fff !important;
    color: #0f172a !important;
    box-shadow: 0 10px 30px rgba(15,23,42,.14) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 1.35rem !important;
    cursor: pointer !important;
    position: relative !important;
}
.notification-button:hover { transform: translateY(-1px); box-shadow: 0 12px 34px rgba(15,23,42,.18) !important; }
.notification-count {
    position: absolute !important;
    top: -5px !important;
    right: -5px !important;
    min-width: 21px !important;
    height: 21px !important;
    padding: 0 6px !important;
    border-radius: 999px !important;
    background: #ef4444 !important;
    color: #fff !important;
    font-size: .68rem !important;
    font-weight: 800 !important;
    line-height: 21px !important;
    text-align: center !important;
    border: 2px solid #fff !important;
}
.notification-dropdown {
    display: none;
    position: absolute !important;
    top: 62px !important;
    right: 0 !important;
    width: 360px !important;
    max-width: calc(100vw - 32px) !important;
    max-height: 480px !important;
    overflow: auto !important;
    background: #fff !important;
    border: 1px solid #e5e7eb !important;
    border-radius: 16px !important;
    box-shadow: 0 18px 50px rgba(15,23,42,.18) !important;
}
.notification-dropdown-header { padding: 14px 16px; border-bottom: 1px solid #eef2f7; display:flex; justify-content:space-between; align-items:center; }
.notification-dropdown-header strong { color:#0f172a; }
.notification-dropdown-header span { color:#64748b; font-size:.72rem; }
.notification-item { padding: 13px 16px; border-bottom:1px solid #f1f5f9; cursor:pointer; }
.notification-item:hover { background:#f8fafc; }
.notification-item.unread { background:#eff6ff; }
.notification-item strong { display:block; color:#0f172a; font-size:.85rem; }
.notification-item p { margin:4px 0; color:#475569; font-size:.78rem; line-height:1.45; }
.notification-item small { color:#94a3b8; font-size:.68rem; }
.notification-empty { padding:30px 18px; text-align:center; color:#64748b; }
.notification-mark-all { padding:10px 14px; background:#fff; position:sticky; bottom:0; }
.notification-mark-all-button { width:100%; border:0; border-radius:10px; padding:9px 12px; background:#eff6ff; color:#2563eb; font-weight:700; cursor:pointer; }
@media (max-width: 640px) { .notification-wrapper { right:14px !important; } .notification-dropdown { width:320px !important; } }
</style>

<div class="notification-wrapper">
    <button type="button" class="notification-button" onclick="toggleNotifications(event)" aria-label="Recent notifications" aria-expanded="false">
        🔔
        {% if unread_count > 0 %}<span class="notification-count" id="notificationCount">{{ unread_count }}</span>{% endif %}
    </button>
    <div id="notificationDropdown" class="notification-dropdown" role="menu">
        <div class="notification-dropdown-header">
            <strong>Recent notifications</strong>
            <span>Last 7 days</span>
        </div>
        {% if recent_notifications %}
            {% for notif in recent_notifications %}
                <div id="notif-{{ notif['id'] }}" class="notification-item {% if notif['is_read'] == 0 %}unread{% endif %}" onclick="openNotification({{ notif['id'] }}, '{{ notif['link_url'] or '' }}', this)">
                    <strong>{{ notif['title'] }}</strong>
                    <p>{{ notif['message'] }}</p>
                    <small>{{ notif['created_at'] }}</small>
                </div>
            {% endfor %}
            {% if unread_count > 0 %}
                <div class="notification-mark-all"><button type="button" onclick="markAllRead(event)" class="notification-mark-all-button">Mark all as read</button></div>
            {% endif %}
        {% else %}
            <div class="notification-empty">No notifications in the last 7 days.</div>
        {% endif %}
    </div>
</div>

<script>
function toggleNotifications(event) {
    if (event) event.stopPropagation();
    const dropdown = document.getElementById('notificationDropdown');
    const button = document.querySelector('.notification-button');
    if (!dropdown) return;
    const open = dropdown.style.display === 'block';
    dropdown.style.display = open ? 'none' : 'block';
    if (button) button.setAttribute('aria-expanded', String(!open));
}
function openNotification(notificationId, link, el) {
    markNotificationRead(notificationId, el, false);
    if (link) window.location.href = link;
}
function markNotificationRead(notificationId, el, redirectAfter) {
    fetch('/notification/read/' + notificationId, { method:'POST', headers:{'X-CSRFToken':'{{ csrf_token() }}'} })
      .then(r => { if (r.ok) { if (el) el.classList.remove('unread'); const c=document.getElementById('notificationCount'); if(c){let n=Math.max(0,(parseInt(c.textContent)||0)-1); if(n===0)c.remove(); else c.textContent=n;} } })
      .catch(()=>{});
}
function markAllRead(e) {
    if(e) e.stopPropagation();
    fetch('/notifications/read-all', { method:'POST', headers:{'X-CSRFToken':'{{ csrf_token() }}'} })
      .then(r=>r.json()).then(data=>{ if(data.ok){document.querySelectorAll('.notification-item.unread').forEach(el=>el.classList.remove('unread')); const c=document.getElementById('notificationCount'); if(c)c.remove();} }).catch(()=>{});
}
document.addEventListener('click', function(event) {
    const wrapper=document.querySelector('.notification-wrapper');
    const dropdown=document.getElementById('notificationDropdown');
    if(wrapper && dropdown && !wrapper.contains(event.target)) dropdown.style.display='none';
});
</script>
