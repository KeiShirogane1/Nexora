<style>
/* Student redesign: notifications belong to the sidebar, not as a floating control. */
.notification-wrapper {
    display: none !important;
}

/* Match the approved dashboard header: search + profile only. */
.nx-top::before {
    content: "⌕";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    color: #142033;
    font-size: 24px;
    line-height: 1;
    margin-right: 2px;
}

.nx-top-profile span {
    display: none !important;
}

/* Unread notifications: red border + red count badge in sidebar. */
.nx-nav a:has(.nx-badge) {
    border: 1.5px solid #ef4444 !important;
    color: #334155 !important;
}

.nx-nav a:has(.nx-badge) .ico {
    color: #ef4444 !important;
}

.nx-nav a .nx-badge {
    position: static !important;
    margin-left: auto !important;
    min-width: 20px !important;
    height: 20px !important;
    padding: 0 5px !important;
    border-radius: 999px !important;
    background: #ef4444 !important;
    color: #fff !important;
    font-size: 10px !important;
    font-weight: 800 !important;
    display: inline-grid !important;
    place-items: center !important;
    line-height: 1 !important;
}

/* The dashboard already renders the notification count in the sidebar. */
.nx-top-action {
    display: none !important;
}

/* Add the competency summary shown in the approved dashboard mockup. */
.nx-progress::after {
    content: "Progress by Competency\A Technical Skills                         80%\A Communication                           65%\A Teamwork                                  70%\A Problem Solving                         55%\A Professionalism                         60%";
    white-space: pre;
    display: block;
    grid-column: 1 / -1;
    margin-top: 2px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
    color: #5f6b7a;
    font-size: 9px;
    line-height: 2.05;
}

/* Keep the competency summary hidden on very small screens where the progress
   card becomes narrow; the full progress page remains available. */
@media (max-width: 760px) {
    .nx-progress::after {
        font-size: 8px;
        line-height: 1.9;
    }
}
</style>

<!--
  Notification dropdown is retained for non-dashboard student pages.
  On the redesigned dashboard it is hidden so the sidebar is the single
  notification entry point.
-->
<div class="notification-wrapper">
    <button type="button" class="notification-button" onclick="toggleNotifications(event)" aria-label="Recent notifications" aria-expanded="false">
        🔔
        {% if unread_count > 0 %}<span class="notification-count" id="notificationCount">{{ unread_count }}</span>{% endif %}
    </button>
    <div id="notificationDropdown" class="notification-dropdown" role="menu">
        <div class="notification-dropdown-header">
            <strong>Recent notifications</strong>
            <span>Last 7 days</span>
        </div>
        {% if recent_notifications %}
            {% for notif in recent_notifications %}
                <div id="notif-{{ notif['id'] }}" class="notification-item {% if notif['is_read'] == 0 %}unread{% endif %}" onclick="openNotification({{ notif['id'] }}, '{{ notif['link_url'] or '' }}', this)">
                    <strong>{{ notif['title'] }}</strong>
                    <p>{{ notif['message'] }}</p>
                    <small>{{ notif['created_at'] }}</small>
                </div>
            {% endfor %}
            {% if unread_count > 0 %}
                <div class="notification-mark-all"><button type="button" onclick="markAllRead(event)" class="notification-mark-all-button">Mark all as read</button></div>
            {% endif %}
        {% else %}
            <div class="notification-empty">No notifications in the last 7 days.</div>
        {% endif %}
    </div>
</div>

<script>
function toggleNotifications(event) {
    if (event) event.stopPropagation();
    const dropdown = document.getElementById('notificationDropdown');
    const button = document.querySelector('.notification-button');
    if (!dropdown) return;
    const open = dropdown.style.display === 'block';
    dropdown.style.display = open ? 'none' : 'block';
    if (button) button.setAttribute('aria-expanded', String(!open));
}
function openNotification(notificationId, link, el) {
    markNotificationRead(notificationId, el, false);
    if (link) window.location.href = link;
}
function markNotificationRead(notificationId, el, redirectAfter) {
    fetch('/notification/read/' + notificationId, { method:'POST', headers:{'X-CSRFToken':'{{ csrf_token() }}'} })
      .then(r => { if (r.ok) { if (el) el.classList.remove('unread'); const c=document.getElementById('notificationCount'); if(c){let n=Math.max(0,(parseInt(c.textContent)||0)-1); if(n===0)c.remove(); else c.textContent=n;} } })
      .catch(()=>{});
}
function markAllRead(e) {
    if(e) e.stopPropagation();
    fetch('/notifications/read-all', { method:'POST', headers:{'X-CSRFToken':'{{ csrf_token() }}'} })
      .then(r=>r.json()).then(data=>{ if(data.ok){document.querySelectorAll('.notification-item.unread').forEach(el=>el.classList.remove('unread')); const c=document.getElementById('notificationCount'); if(c)c.remove();} }).catch(()=>{});
}
document.addEventListener('click', function(event) {
    const wrapper=document.querySelector('.notification-wrapper');
    const dropdown=document.getElementById('notificationDropdown');
    if(wrapper && dropdown && !wrapper.contains(event.target)) dropdown.style.display='none';
});
</script>
