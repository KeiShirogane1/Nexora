<style id="nx-quick-search-input-fix">
/*
 * The global portal form-control pass intentionally strengthens normal inputs.
 * Quick Search is the exception: its rounded shell is the control, so the
 * nested search input must remain visually transparent and borderless.
 */
body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input] {
    all: unset !important;
    box-sizing: border-box !important;
    flex: 1 1 auto !important;
    width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    min-height: 0 !important;
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    outline: 0 !important;
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
    color: var(--nx-topbar-ink) !important;
    font-family: inherit !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    line-height: 1.35 !important;
    -webkit-appearance: none !important;
    appearance: none !important;
}

body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]:focus,
body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]:focus-visible {
    border: 0 !important;
    outline: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
}

body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]::placeholder {
    color: #92a0ae !important;
    opacity: 1 !important;
    font-weight: 500 !important;
}

body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]::-webkit-search-decoration,
body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]::-webkit-search-cancel-button,
body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]::-webkit-search-results-button,
body:has(.nx-role-sidebar-shell) .nx-role-topbar .nx-quick-search-control > input[type="search"][data-nx-quick-search-input]::-webkit-search-results-decoration {
    -webkit-appearance: none !important;
    appearance: none !important;
}
</style>
<script>
(function () {
    function forceQuickSearchVisualReset() {
        document.querySelectorAll('input[data-nx-quick-search-input]').forEach(function (input) {
            input.style.setProperty('border', '0', 'important');
            input.style.setProperty('outline', '0', 'important');
            input.style.setProperty('box-shadow', 'none', 'important');
            input.style.setProperty('background', 'transparent', 'important');
            input.style.setProperty('background-color', 'transparent', 'important');
            input.style.setProperty('border-radius', '0', 'important');
            input.style.setProperty('padding', '0', 'important');
            input.style.setProperty('-webkit-appearance', 'none', 'important');
            input.style.setProperty('appearance', 'none', 'important');
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', forceQuickSearchVisualReset, {once: true});
    } else {
        forceQuickSearchVisualReset();
    }
})();
</script>
<style id="nx-collapsed-sidebar-parent-centering-fix">
/* Keep submenu disclosure arrows out of the 76px rail so parent icons sit on the true centerline. */
@media (min-width: 761px) {
    .nx-role-sidebar:not(:hover):not(:focus-within) .nx-role-nav-parent {
        justify-content: center !important;
        gap: 0 !important;
    }
    .nx-role-sidebar:not(:hover):not(:focus-within) .nx-role-nav-parent .nx-role-nav-arrow {
        display: none !important;
        width: 0 !important;
        min-width: 0 !important;
        flex: 0 0 0 !important;
        margin: 0 !important;
    }
}
</style>
