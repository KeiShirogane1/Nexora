<header class="admin-global-topbar" aria-label="Admin portal header">
    <div class="admin-topbar-left">
        <label class="admin-search" aria-label="Search">
            <span aria-hidden="true">⌕</span>
            <input type="search" placeholder="Search anything...">
        </label>
    </div>
    <div class="admin-topbar-right">
        {% include 'components/admin_notification_bell.html' %}
        <div class="admin-topbar-user">
            <img src="{{ url_for('static', filename='images/default_profile.png') }}" alt="Administrator profile">
            <span><strong>Administrator</strong><small>Admin</small></span>
        </div>
    </div>
</header>
