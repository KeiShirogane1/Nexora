<script>
(function () {
    var favicon = document.querySelector('link[rel~="icon"]');
    if (!favicon) {
        favicon = document.createElement('link');
        favicon.rel = 'icon';
        document.head.appendChild(favicon);
    }
    favicon.type = 'image/png';
    favicon.href = "{{ url_for('static', filename='images/nexora_logo_student.png') }}";
})();
</script>
<nav class="nexora-navbar">
    <div class="nexora-nav-left">
        <div class="nexora-logo">
            <img src="{{ url_for('static', filename='images/nexora_logo_student.png') }}" alt="Nexora Logo" class="logo-image">
            <span class="logo-text">Nexora</span>
        </div>
    </div>

    <div class="nexora-nav-right">
        <a href="/student/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
            Dashboard
        </a>
        <a href="/student/logbook" class="nav-link {% if active_page == 'logbook' %}active{% endif %}">
            Logbook
        </a>
        <a href="/student/tasks" class="nav-link {% if active_page == 'tasks' %}active{% endif %}">
            Tasks
        </a>
        <a href="/student/documents" class="nav-link {% if active_page == 'documents' %}active{% endif %}">
            Documents
        </a>
        <a href="/logout" class="nav-link logout-link" onclick="return confirm('Are you sure you want to logout?')">
            Logout
        </a>
    </div>
</nav>
