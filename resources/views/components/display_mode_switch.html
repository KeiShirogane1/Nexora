<script id="nx-display-mode-controller">
(function () {
    if (window.__nexoraDisplayModeReady) return;
    window.__nexoraDisplayModeReady = true;

    var STORAGE_KEY = 'nexoraDisplayPreferenceV2';
    var DESKTOP_WIDTH = 1180;
    var MOBILE_BREAKPOINT = 760;

    function getViewportMeta() {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (!viewport) {
            viewport = document.createElement('meta');
            viewport.name = 'viewport';
            document.head.appendChild(viewport);
        }
        return viewport;
    }

    function screenShortEdge() {
        var width = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
        var height = window.screen && window.screen.height ? window.screen.height : window.innerHeight;
        return Math.min(width || 9999, height || 9999);
    }

    function isTouchDevice() {
        return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    }

    function canSwitchDisplayMode() {
        return isTouchDevice() && screenShortEdge() <= 1000;
    }

    function readStoredMode() {
        try {
            var value = localStorage.getItem(STORAGE_KEY);
            return value === 'mobile' || value === 'desktop' ? value : null;
        } catch (error) {
            return null;
        }
    }

    function storeMode(mode) {
        try {
            localStorage.setItem(STORAGE_KEY, mode);
        } catch (error) {}
    }

    function naturalMode() {
        /*
         * Nexora owns its in-app display choice on phone-like touch devices.
         * Browser "Desktop site" presentation must not silently change the
         * portal mode or authentication state. Users switch views only with
         * the Nexora display button.
         */
        return canSwitchDisplayMode() ? 'mobile' : 'desktop';
    }

    function desktopScale() {
        var physicalWidth =
            window.screen && window.screen.width
                ? window.screen.width
                : window.innerWidth || 360;

        return Math.max(0.25, Math.min(1, physicalWidth / DESKTOP_WIDTH));
    }

    function updateToggle(mode) {
        var button = document.querySelector('[data-nx-display-toggle]');
        if (!button) return;

        var nextMode = mode === 'desktop' ? 'mobile' : 'desktop';
        var label = nextMode === 'desktop' ? 'Desktop View' : 'Mobile View';

        button.dataset.nextMode = nextMode;
        button.setAttribute('aria-label', 'Switch to ' + label);
        button.setAttribute('title', 'Switch to ' + label);

        var mobileIcon = button.querySelector('[data-nx-display-mobile-icon]');
        var desktopIcon = button.querySelector('[data-nx-display-desktop-icon]');
        if (mobileIcon) mobileIcon.hidden = nextMode !== 'mobile';
        if (desktopIcon) desktopIcon.hidden = nextMode !== 'desktop';
    }

    function applyMode(mode, persist) {
        var resolved = mode === 'desktop' ? 'desktop' : 'mobile';
        var viewport = getViewportMeta();

        if (resolved === 'desktop') {
            var scale = desktopScale();
            viewport.setAttribute(
                'content',
                'width=' + DESKTOP_WIDTH +
                ', initial-scale=' + scale.toFixed(3) +
                ', minimum-scale=0.25, maximum-scale=5, user-scalable=yes'
            );
        } else {
            viewport.setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5, user-scalable=yes'
            );
        }

        document.documentElement.dataset.nxDisplayMode = resolved;
        window.__nexoraDisplayMode = resolved;

        if (persist !== false) storeMode(resolved);
        updateToggle(resolved);

        window.setTimeout(function () {
            try {
                window.dispatchEvent(new Event('resize'));
            } catch (error) {}
        }, 40);
    }

    function createToggle() {
        if (!canSwitchDisplayMode() || !document.body) return;
        if (document.querySelector('[data-nx-display-toggle]')) return;

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'nx-display-mode-toggle';
        button.setAttribute('data-nx-display-toggle', '');
        button.innerHTML =
            '<svg data-nx-display-mobile-icon viewBox="0 0 24 24" aria-hidden="true">' +
                '<rect x="7" y="2.5" width="10" height="19" rx="2"></rect>' +
                '<path d="M10 5h4"></path>' +
                '<path d="M11.5 18.5h1"></path>' +
            '</svg>' +
            '<svg data-nx-display-desktop-icon viewBox="0 0 24 24" aria-hidden="true" hidden>' +
                '<rect x="3" y="4" width="18" height="12" rx="2"></rect>' +
                '<path d="M8 20h8"></path>' +
                '<path d="M12 16v4"></path>' +
            '</svg>';

        button.addEventListener('click', function () {
            applyMode(button.dataset.nextMode === 'desktop' ? 'desktop' : 'mobile', true);
        });

        document.body.appendChild(button);
        updateToggle(window.__nexoraDisplayMode || naturalMode());
    }

    var initialMode = readStoredMode() || naturalMode();

    if (canSwitchDisplayMode()) {
        applyMode(initialMode, false);
    } else {
        document.documentElement.dataset.nxDisplayMode = 'desktop';
        window.__nexoraDisplayMode = 'desktop';
    }

    window.NexoraDisplayMode = {
        get: function () {
            return window.__nexoraDisplayMode || naturalMode();
        },
        set: function (mode) {
            if (!canSwitchDisplayMode()) return;
            applyMode(mode, true);
        },
        toggle: function () {
            if (!canSwitchDisplayMode()) return;
            applyMode(
                window.__nexoraDisplayMode === 'desktop' ? 'mobile' : 'desktop',
                true
            );
        },
        reset: function () {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (error) {}
            if (canSwitchDisplayMode()) applyMode(naturalMode(), false);
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createToggle, { once: true });
    } else {
        createToggle();
    }
})();
</script>
