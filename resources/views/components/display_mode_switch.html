<script id="nx-display-mode-controller">
(function () {
    if (window.__nexoraDisplayModeReady) return;
    window.__nexoraDisplayModeReady = true;

    var STORAGE_KEY = 'nexoraDisplayMode';
    var DESKTOP_WIDTH = 1180;
    var isTouchDevice =
        (navigator.maxTouchPoints || 0) > 0 ||
        'ontouchstart' in window;
    var screenWidth =
        window.screen && window.screen.width
            ? window.screen.width
            : window.innerWidth;
    var screenHeight =
        window.screen && window.screen.height
            ? window.screen.height
            : window.innerHeight;
    var shortEdge = Math.min(
        screenWidth || 9999,
        screenHeight || 9999
    );
    var isPhoneLike = isTouchDevice && shortEdge <= 900;

    if (!isPhoneLike) {
        document.documentElement.dataset.nxDisplayMode = 'desktop';
        return;
    }

    function getViewportMeta() {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (!viewport) {
            viewport = document.createElement('meta');
            viewport.name = 'viewport';
            document.head.appendChild(viewport);
        }
        return viewport;
    }

    function readStoredMode() {
        try {
            var value = sessionStorage.getItem(STORAGE_KEY);
            return value === 'mobile' || value === 'desktop'
                ? value
                : null;
        } catch (error) {
            return null;
        }
    }

    function storeMode(mode) {
        try {
            sessionStorage.setItem(STORAGE_KEY, mode);
        } catch (error) {}
    }

    function isDirectEntry() {
        var navigation = null;
        try {
            var entries = performance.getEntriesByType('navigation');
            navigation = entries && entries.length ? entries[0] : null;
        } catch (error) {}

        if (navigation && navigation.type !== 'navigate') {
            return false;
        }

        if (!document.referrer) return true;

        try {
            return new URL(document.referrer).origin !== location.origin;
        } catch (error) {
            return true;
        }
    }

    function desktopScale() {
        var physicalWidth =
            window.screen && window.screen.width
                ? window.screen.width
                : window.innerWidth || 360;

        return Math.max(
            0.25,
            Math.min(1, physicalWidth / DESKTOP_WIDTH)
        );
    }

    function updateToggle(mode) {
        var button = document.querySelector('[data-nx-display-toggle]');
        if (!button) return;

        var nextMode = mode === 'desktop' ? 'mobile' : 'desktop';
        var label = nextMode === 'mobile'
            ? 'Mobile View'
            : 'Desktop View';

        button.dataset.nextMode = nextMode;
        button.setAttribute('aria-label', 'Switch to ' + label);
        button.setAttribute('title', 'Switch to ' + label);

        var text = button.querySelector('[data-nx-display-label]');
        if (text) text.textContent = label;

        var mobileIcon = button.querySelector('[data-nx-display-mobile-icon]');
        var desktopIcon = button.querySelector('[data-nx-display-desktop-icon]');

        if (mobileIcon) mobileIcon.hidden = nextMode !== 'mobile';
        if (desktopIcon) desktopIcon.hidden = nextMode !== 'desktop';
    }

    function applyMode(mode, persist) {
        var viewport = getViewportMeta();
        var resolved = mode === 'mobile' ? 'mobile' : 'desktop';
        var root = document.documentElement;

        if (resolved === 'mobile') {
            viewport.setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5, user-scalable=yes'
            );
            root.style.setProperty(
                '--nx-display-control-scale',
                '1'
            );
        } else {
            var scale = desktopScale();

            viewport.setAttribute(
                'content',
                'width=' + DESKTOP_WIDTH +
                ', initial-scale=' + scale.toFixed(3) +
                ', minimum-scale=0.25, maximum-scale=5, user-scalable=yes'
            );

            root.style.setProperty(
                '--nx-display-control-scale',
                String(Math.min(4, 1 / scale))
            );
        }

        root.dataset.nxDisplayMode = resolved;
        window.__nexoraDisplayMode = resolved;

        if (persist !== false) {
            storeMode(resolved);
        }

        updateToggle(resolved);

        window.setTimeout(function () {
            try {
                window.dispatchEvent(new Event('resize'));
            } catch (error) {}
        }, 40);
    }

    function createToggle() {
        if (
            document.querySelector('[data-nx-display-toggle]') ||
            !document.body
        ) {
            return;
        }

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'nx-display-mode-toggle';
        button.setAttribute('data-nx-display-toggle', '');
        button.innerHTML =
            '<svg data-nx-display-mobile-icon viewBox="0 0 24 24" aria-hidden="true">' +
                '<rect x="7" y="2.5" width="10" height="19" rx="2"></rect>' +
                '<path d="M10 5h4"></path>' +
                '<path d="M11.5 18.5h1"></path>' +
            '</svg>' +
            '<svg data-nx-display-desktop-icon viewBox="0 0 24 24" aria-hidden="true" hidden>' +
                '<rect x="3" y="4" width="18" height="12" rx="2"></rect>' +
                '<path d="M8 20h8"></path>' +
                '<path d="M12 16v4"></path>' +
            '</svg>' +
            '<span data-nx-display-label>Mobile View</span>';

        button.addEventListener('click', function () {
            var nextMode =
                button.dataset.nextMode === 'desktop'
                    ? 'desktop'
                    : 'mobile';
            applyMode(nextMode, true);
        });

        document.body.appendChild(button);
        updateToggle(window.__nexoraDisplayMode || 'desktop');
    }

    var initialMode = readStoredMode() || 'desktop';

    /*
     * A direct/external entry starts in Desktop View.
     * Reloads keep the user's chosen Nexora mode, so display changes
     * never interact with Flask authentication or account sessions.
     */
    if (isDirectEntry()) {
        initialMode = 'desktop';
    }

    applyMode(initialMode, true);

    window.NexoraDisplayMode = {
        get: function () {
            return window.__nexoraDisplayMode || 'desktop';
        },
        set: function (mode) {
            applyMode(mode, true);
        },
        toggle: function () {
            applyMode(
                window.__nexoraDisplayMode === 'desktop'
                    ? 'mobile'
                    : 'desktop',
                true
            );
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener(
            'DOMContentLoaded',
            createToggle,
            { once: true }
        );
    } else {
        createToggle();
    }
})();
</script>

    position: fixed;
    right: 16px;
    bottom: 92px;
    z-index: 1450;
    min-width: 132px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 13px;
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    color: var(--nx-topbar-ink, #17324d);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transform: scale(var(--nx-display-control-scale, 1));
    transform-origin: right bottom;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
}

.nx-display-mode-toggle:hover,
.nx-display-mode-toggle:focus-visible {
    border-color: var(--nx-topbar-accent, #1b8f6a);
    color: var(--nx-topbar-accent, #1b8f6a);
    outline: none;
}

.nx-display-mode-toggle svg {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
}

html[data-nx-display-mode="mobile"] .nx-display-mode-toggle {
    right: 12px;
    bottom: 84px;
    min-width: 124px;
    height: 42px;
    padding: 0 12px;
    transform: none;
}

@media (min-width: 901px) and (pointer: fine) {
    .nx-display-mode-toggle {
        display: none !important;
    }
}
</style>
