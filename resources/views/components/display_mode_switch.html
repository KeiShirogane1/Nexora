<script id="nx-display-mode-controller">
(function () {
    if (window.__nexoraDisplayModeReady) return;
    window.__nexoraDisplayModeReady = true;

    var STORAGE_KEY = 'nexoraDisplayPreferenceV2';
    var BROWSER_MODE_KEY = 'nexoraBrowserDesktopSiteV1';
    var DESKTOP_WIDTH = 1180;
    var MOBILE_BREAKPOINT = 760;

    function getViewportMeta() {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (!viewport) {
            viewport = document.createElement('meta');
            viewport.name = 'viewport';
            document.head.appendChild(viewport);
        }
        return viewport;
    }

    function screenShortEdge() {
        var width = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
        var height = window.screen && window.screen.height ? window.screen.height : window.innerHeight;
        return Math.min(width || 9999, height || 9999);
    }

    function isTouchDevice() {
        return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    }

    function canSwitchDisplayMode() {
        return isTouchDevice() && screenShortEdge() <= 1000;
    }

    function browserRequestsDesktopSite() {
        if (!isTouchDevice()) return false;

        /*
         * Chrome exposes its requested form factor through UA Client Hints
         * on Android. This lets Nexora distinguish Chrome's own "Desktop site"
         * from Nexora's in-page Desktop View.
         */
        try {
            if (
                navigator.userAgentData &&
                typeof navigator.userAgentData.mobile === 'boolean'
            ) {
                var platform = String(navigator.userAgentData.platform || '');
                if (/android/i.test(platform)) {
                    return navigator.userAgentData.mobile === false;
                }
            }
        } catch (error) {}

        var ua = String(navigator.userAgent || '');

        /*
         * Android Chrome normally includes "Mobile" in phone mode and drops it
         * when "Desktop site" is requested. The wide initial viewport is a
         * final fallback for reduced desktop-style user agents.
         */
        if (/android/i.test(ua)) {
            return !/mobile/i.test(ua);
        }

        return (
            canSwitchDisplayMode() &&
            window.innerWidth >= 900 &&
            !/iphone|ipod|mobile/i.test(ua)
        );
    }

    function readBrowserMode() {
        try {
            var value = localStorage.getItem(BROWSER_MODE_KEY);
            return value === 'desktop-site' || value === 'mobile-site'
                ? value
                : null;
        } catch (error) {
            return null;
        }
    }

    function storeBrowserMode(value) {
        try {
            localStorage.setItem(BROWSER_MODE_KEY, value);
        } catch (error) {}
    }

    function readStoredMode() {
        try {
            var value = localStorage.getItem(STORAGE_KEY);
            return value === 'mobile' || value === 'desktop' ? value : null;
        } catch (error) {
            return null;
        }
    }

    function storeMode(mode) {
        try {
            localStorage.setItem(STORAGE_KEY, mode);
        } catch (error) {}
    }

    function naturalMode() {
        /*
         * Nexora owns its in-app display choice on phone-like touch devices.
         * Browser "Desktop site" presentation must not silently change the
         * portal mode or authentication state. Users switch views only with
         * the Nexora display button.
         */
        return canSwitchDisplayMode() ? 'mobile' : 'desktop';
    }

    function desktopScale() {
        var physicalWidth =
            window.screen && window.screen.width
                ? window.screen.width
                : window.innerWidth || 360;

        return Math.max(0.25, Math.min(1, physicalWidth / DESKTOP_WIDTH));
    }

    function updateToggle(mode) {
        var button = document.querySelector('[data-nx-display-toggle]');
        if (!button) return;

        var nextMode = mode === 'desktop' ? 'mobile' : 'desktop';
        var label = nextMode === 'desktop' ? 'Desktop View' : 'Mobile View';

        button.dataset.nextMode = nextMode;
        button.setAttribute('aria-label', 'Switch to ' + label);
        button.setAttribute('title', 'Switch to ' + label);

        var mobileIcon = button.querySelector('[data-nx-display-mobile-icon]');
        var desktopIcon = button.querySelector('[data-nx-display-desktop-icon]');

        /*
         * The icon represents the mode the user can switch TO:
         * Mobile View  -> show the PC/Desktop icon.
         * Desktop View -> show the Phone icon.
         * Use both hidden and inline display so page CSS cannot reverse it.
         */
        if (mobileIcon) {
            var showPhone = mode === 'desktop';
            mobileIcon.hidden = !showPhone;
            mobileIcon.style.display = showPhone ? 'block' : 'none';
        }
        if (desktopIcon) {
            var showDesktop = mode === 'mobile';
            desktopIcon.hidden = !showDesktop;
            desktopIcon.style.display = showDesktop ? 'block' : 'none';
        }
    }

    function applyMode(mode, persist) {
        var resolved = mode === 'desktop' ? 'desktop' : 'mobile';
        var viewport = getViewportMeta();

        if (resolved === 'desktop') {
            var scale = desktopScale();
            viewport.setAttribute(
                'content',
                'width=' + DESKTOP_WIDTH +
                ', initial-scale=' + scale.toFixed(3) +
                ', minimum-scale=0.25, maximum-scale=5, user-scalable=yes'
            );
        } else {
            viewport.setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5, user-scalable=yes'
            );
        }

        document.documentElement.dataset.nxDisplayMode = resolved;
        window.__nexoraDisplayMode = resolved;

        if (persist !== false) storeMode(resolved);
        updateToggle(resolved);

        window.setTimeout(function () {
            try {
                window.dispatchEvent(new Event('resize'));
            } catch (error) {}
        }, 40);
    }

    function createToggle() {
        if (
            !canSwitchDisplayMode() ||
            browserRequestsDesktopSite() ||
            !document.body
        ) return;
        if (document.querySelector('[data-nx-display-toggle]')) return;

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'nx-display-mode-toggle';
        button.setAttribute('data-nx-display-toggle', '');
        button.innerHTML =
            '<svg data-nx-display-mobile-icon viewBox="0 0 24 24" aria-hidden="true">' +
                '<rect x="7" y="2.5" width="10" height="19" rx="2"></rect>' +
                '<path d="M10 5h4"></path>' +
                '<path d="M11.5 18.5h1"></path>' +
            '</svg>' +
            '<svg data-nx-display-desktop-icon viewBox="0 0 24 24" aria-hidden="true" hidden>' +
                '<rect x="3" y="4" width="18" height="12" rx="2"></rect>' +
                '<path d="M8 20h8"></path>' +
                '<path d="M12 16v4"></path>' +
            '</svg>';

        button.addEventListener('click', function () {
            applyMode(button.dataset.nextMode === 'desktop' ? 'desktop' : 'mobile', true);
        });

        document.body.appendChild(button);
        updateToggle(window.__nexoraDisplayMode || naturalMode());
    }

    var chromeDesktopSite = browserRequestsDesktopSite();
    var previousBrowserMode = readBrowserMode();
    var initialMode = readStoredMode() || naturalMode();

    if (chromeDesktopSite) {
        /*
         * Chrome owns the viewport while its browser-level Desktop site option
         * is on. Do not fight that mode and do not render the Nexora switch.
         */
        document.documentElement.dataset.nxBrowserDesktopSite = 'true';
        document.documentElement.dataset.nxDisplayMode = 'desktop';
        window.__nexoraDisplayMode = 'desktop';
        storeBrowserMode('desktop-site');
    } else if (canSwitchDisplayMode()) {
        document.documentElement.dataset.nxBrowserDesktopSite = 'false';

        /*
         * First normal phone load starts in Mobile View. More importantly,
         * turning Chrome Desktop site OFF causes a reload; detecting that
         * desktop-site -> mobile-site transition resets Nexora to Mobile View.
         * After that, the user's Nexora PC/Phone button choice persists across
         * normal page navigation until Chrome's browser mode changes again.
         */
        if (
            previousBrowserMode === null ||
            previousBrowserMode === 'desktop-site'
        ) {
            initialMode = 'mobile';
            storeMode('mobile');
        }

        storeBrowserMode('mobile-site');
        applyMode(initialMode, false);
    } else {
        document.documentElement.dataset.nxBrowserDesktopSite = 'false';
        document.documentElement.dataset.nxDisplayMode = 'desktop';
        window.__nexoraDisplayMode = 'desktop';
    }

    window.NexoraDisplayMode = {
        get: function () {
            return window.__nexoraDisplayMode || naturalMode();
        },
        set: function (mode) {
            if (!canSwitchDisplayMode() || browserRequestsDesktopSite()) return;
            applyMode(mode, true);
        },
        toggle: function () {
            if (!canSwitchDisplayMode() || browserRequestsDesktopSite()) return;
            applyMode(
                window.__nexoraDisplayMode === 'desktop' ? 'mobile' : 'desktop',
                true
            );
        },
        reset: function () {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (error) {}
            if (canSwitchDisplayMode()) applyMode(naturalMode(), false);
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createToggle, { once: true });
    } else {
        createToggle();
    }
})();
</script>

<style id="nx-display-mode-styles">
.nx-display-mode-toggle {
    position: fixed;
    right: 24px;
    bottom: 92px;
    z-index: 3150;
    width: 52px;
    min-width: 52px;
    height: 58px;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.97);
    color: var(--nx-topbar-accent, #2563eb);
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.16);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    cursor: pointer;
    touch-action: manipulation;
}

.nx-display-mode-toggle:hover,
.nx-display-mode-toggle:focus-visible {
    border-color: var(--nx-topbar-accent, #2563eb);
    background: var(--nx-topbar-accent-soft, #eff6ff);
    color: var(--nx-topbar-accent, #2563eb);
    outline: none;
}

.nx-display-mode-toggle svg {
    width: 23px;
    height: 23px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
}

html[data-nx-display-mode="mobile"] .nx-display-mode-toggle {
    right: 14px;
    bottom: 78px;
    width: 48px;
    min-width: 48px;
    height: 54px;
    border-radius: 11px;
}

}
</style>
