<script>
(function () {
    function initMobilePortalNavigation() {
        var shell = document.querySelector('.nx-role-sidebar-shell');
        var sidebar = shell ? shell.querySelector('.nx-role-sidebar') : null;
        var backdrop = shell ? shell.querySelector('.nx-role-sidebar-backdrop') : null;
        var topbarLeft = document.querySelector('.nx-role-topbar-left');

        if (!shell || !sidebar || !backdrop || !topbarLeft) return;
        if (document.querySelector('[data-nx-mobile-menu]')) return;

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'nx-mobile-menu-button';
        button.setAttribute('data-nx-mobile-menu', '');
        button.setAttribute('aria-label', 'Open navigation menu');
        button.setAttribute('aria-expanded', 'false');
        if (sidebar.id) button.setAttribute('aria-controls', sidebar.id);
        button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>';
        topbarLeft.insertBefore(button, topbarLeft.firstChild);

        function isMobile() {
            return window.matchMedia('(max-width: 760px)').matches;
        }

        function setOpen(open, restoreFocus) {
            if (!isMobile()) open = false;
            shell.classList.toggle('is-mobile-open', open);
            document.body.classList.toggle('nx-mobile-nav-open', open);
            button.setAttribute('aria-expanded', open ? 'true' : 'false');
            button.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
            sidebar.setAttribute('aria-hidden', open || !isMobile() ? 'false' : 'true');

            if (open) {
                var firstTarget = sidebar.querySelector('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])');
                if (firstTarget) window.setTimeout(function () { firstTarget.focus(); }, 40);
            } else if (restoreFocus && isMobile()) {
                button.focus();
            }
        }

        button.addEventListener('click', function () {
            setOpen(!shell.classList.contains('is-mobile-open'), false);
        });

        backdrop.addEventListener('click', function () {
            setOpen(false, true);
        });

        sidebar.addEventListener('click', function (event) {
            if (!isMobile()) return;
            var link = event.target.closest('a[href]');
            if (link) setOpen(false, false);
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && shell.classList.contains('is-mobile-open')) {
                event.preventDefault();
                setOpen(false, true);
            }
        });

        window.addEventListener('resize', function () {
            if (!isMobile()) setOpen(false, false);
            else if (!shell.classList.contains('is-mobile-open')) sidebar.setAttribute('aria-hidden', 'true');
        });

        setOpen(false, false);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMobilePortalNavigation, { once: true });
    } else {
        initMobilePortalNavigation();
    }
})();
</script>
