<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

<title>{{ title }} - Nexora</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body class="executive_aesthetic">


{% include 'components/admin_navbar.html' %}
{% include 'components/admin_sidebar.html' %}



<div class="page-content">


<div class="container mt-5">


<h1 class="page-heading-on-dark">
{{ title }}
</h1>


<p class="page-copy-on-dark">
Manage {{ user_type }} accounts.
</p>



<div class="card shadow-sm mt-4">


<table class="table table-hover mb-0">


<thead class="table-light">

<tr>

<th>ID</th>

<th>Username</th>

<th>Role</th>

<th>Actions</th>


</tr>

</thead>



<tbody>


{% for user in users %}


<tr>


<td>
{{ user[0] }}
</td>


<td>
{{ user[1] }}
</td>


<td>

<span class="badge bg-success">
{{ user[2] }}
</span>

</td>



<td>


<button class="btn btn-sm btn-primary">
View
</button>


<button class="btn btn-sm btn-danger">
Delete
</button>


</td>



</tr>


{% endfor %}



</tbody>



</table>



</div>


<a href="{{ url_for('admin.admin_users') }}"
class="btn btn-secondary mt-4">

Back

</a>


</div>


</div>


</body>


</html>
