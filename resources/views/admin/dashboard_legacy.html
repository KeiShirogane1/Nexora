<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Admin Dashboard - Nexora</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body class="deeper-metrics">

        {% include 'components/admin_navbar.html' %}

        <div class="container mt-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <h1 class="page-heading-on-dark">Admin Dashboard</h1>
                    <p class="page-copy-on-dark">Overview of students, supervisors, and feedback activity.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card p-4 shadow-sm">
                        <h2 class="mb-2">{{ students_count }}</h2>
                        <p class="text-muted mb-0">Students</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-4 shadow-sm">
                        <h2 class="mb-2">{{ supervisors_count }}</h2>
                        <p class="text-muted mb-0">Supervisors</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-4 shadow-sm">
                        <h2 class="mb-2">{{ feedback_count }}</h2>
                        <p class="text-muted mb-0">Feedback Entries</p>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
