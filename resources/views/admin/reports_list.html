<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Internship Reports - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body class="executive_aesthetic">

    {% include 'components/admin_sidebar.html' %}

    <div class="admin-main nexora-app-main">
        <div class="nexora-page">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
            <div>
                <h1 class="page-heading-on-dark">Internship Reports</h1>
                <p class="page-copy-on-dark">
                    Select an intern to view their Internship Performance Report.
                </p>
            </div>
        </div>

        <div class="card shadow-sm">

            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table table-hover mb-0">

                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Intern</th>
                                <th>Supervisor</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            {% for student in students %}

                            <tr>

                                <td>{{ student[0] }}</td>

                                <td>{{ student[1] }}</td>

                                <td>{{ student[2] }}</td>

                                <td>

                                    <a href="{{ url_for('admin.student_report', student_id=student[0]) }}"
                                       class="btn btn-info btn-sm">

                                        View Report

                                    </a>

                                </td>

                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>
    </div>

</body>
</html>
