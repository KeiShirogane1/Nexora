<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nexora — Forgot Password</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
            .auth-brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; }
            .auth-brand img { height:36px; }
            .auth-message { margin:12px 0; padding:11px 12px; background:#eaf4ff; color:#235fa3; border:1px solid #c9e2ff; border-radius:6px; font-size:0.9rem; }
        </style>
    </head>
    <body class="general-page">
        <div class="login-container" style="width:420px;">
            <div class="auth-brand">
                <img src="{{ url_for('static', filename='images/Nexora Light.png') }}" alt="Nexora">
                <strong style="color:#0f172a;">Nexora</strong>
            </div>
            <h2 style="margin-bottom:6px;">Forgot password</h2>
            <p class="auth-description" style="color:#64748b; font-size:0.9rem; margin-bottom:14px;">Enter the email associated with your account. We'll send a secure reset link.</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="auth-message">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="email" name="email" placeholder="Email Address" autocomplete="email" required style="width:100%;">
                <button type="submit" style="width:100%; margin-top:12px;">Send Reset Link</button>
            </form>
            <p class="signup-link">Remember your password? <a href="{{ url_for('auth.login') }}">Back to Login</a></p>
        </div>
    </body>
</html>
