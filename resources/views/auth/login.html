<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nexora Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="general-page">

    <div class="login-container">
        <h2>Nexora Login</h2>

        <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if error %}
            <div style="margin: 12px 0; padding: 10px; background: #ffe5e5; color: #b00020; border-radius: 6px; text-align: center;">
                {{ error }}
            </div>
            {% endif %}
            <input
                type="text"
                name="username"
                placeholder="Username"
                value="{{ entered_username or '' }}"
                required
            >
            <input type="password" name="password" placeholder="Password" required>

            <p class="forgot-password-link" style="text-align:right; margin: 8px 0 0; font-size: 0.85rem;">
                <a href="{{ url_for('password.forgot_password') }}" style="color: #2563eb; text-decoration: none; font-weight: 600;">
                    Forgot Password?
                </a>
            </p>

            <button type="submit">Login</button>

            <p class="signup-link">Don't have an account? <a href="/signup">Sign Up</a></p>
        </form>
    </div>

</body>
</html>
