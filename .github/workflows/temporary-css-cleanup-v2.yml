name: One-time CSS cleanup v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[css-cleanup-trigger]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize CSS safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CSS_DIR = Path('resources/assets/css')
          FILES = [
              CSS_DIR / 'admin.css',
              CSS_DIR / 'modals.css',
              CSS_DIR / 'sidebars.css',
              CSS_DIR / 'student.css',
              CSS_DIR / 'style.css',
              CSS_DIR / 'supervisor.css',
          ]

          LEGACY_SELECTOR_MARKERS = (
              '.admin-sidebar',
              '.supervisor-sidebar',
              '.student-sidebar',
              '.nx-student-shell',
              '.nx-sidebar',
              '.nx-collapse-toggle',
              'body.supervisor-dashboard-page .sidebar-',
              'body.supervisor-dashboard-page .nav-icon',
          )

          def repair_invalid_period_terminators(text: str) -> str:
              fixed = []
              for line in text.replace('\r\n', '\n').replace('\r', '\n').split('\n'):
                  stripped = line.strip()
                  if re.match(r'^(?:--[\w-]+|[A-Za-z_-][\w-]*)\s*:\s*.+\.$', stripped):
                      pos = line.rfind('.')
                      line = line[:pos] + ';' + line[pos + 1:]
                  fixed.append(line)
              return '\n'.join(fixed)

          def beautify_css(text: str) -> str:
              lines = []
              current = []
              indent = 0
              paren_depth = 0
              quote = None
              escape = False
              i = 0

              def normalize_piece(piece: str) -> str:
                  piece = re.sub(r'[ \t\n]+', ' ', piece.strip())
                  if re.match(r'^(--[\w-]+|[A-Za-z_-][\w-]*)\s*:', piece):
                      piece = re.sub(
                          r'^([^:]+):\s*',
                          lambda match: match.group(1).strip() + ': ',
                          piece,
                          count=1,
                      )
                  return piece

              def flush(extra=''):
                  nonlocal current
                  piece = normalize_piece(''.join(current))
                  value = (piece + extra).strip()
                  if value:
                      lines.append('    ' * indent + value)
                  current = []

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''

                  if quote:
                      current.append(ch)
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      current.append(ch)
                      i += 1
                      continue

                  if ch == '/' and nxt == '*':
                      flush()
                      end = text.find('*/', i + 2)
                      if end == -1:
                          comment = text[i:]
                          i = len(text)
                      else:
                          comment = text[i:end + 2]
                          i = end + 2
                      for raw in comment.splitlines():
                          lines.append('    ' * indent + raw.strip())
                      continue

                  if ch == '(':
                      paren_depth += 1
                      current.append(ch)
                      i += 1
                      continue

                  if ch == ')':
                      paren_depth = max(0, paren_depth - 1)
                      current.append(ch)
                      i += 1
                      continue

                  if paren_depth == 0 and ch == '{':
                      flush(' {')
                      indent += 1
                      i += 1
                      continue

                  if paren_depth == 0 and ch == '}':
                      flush()
                      indent = max(0, indent - 1)
                      lines.append('    ' * indent + '}')
                      i += 1
                      continue

                  if paren_depth == 0 and ch == ';':
                      current.append(';')
                      flush()
                      i += 1
                      continue

                  if ch.isspace():
                      if current and not current[-1].isspace():
                          current.append(' ')
                      i += 1
                      continue

                  current.append(ch)
                  i += 1

              flush()
              return '\n'.join(line.rstrip() for line in lines).strip() + '\n'

          def find_matching_brace(text: str, open_index: int) -> int:
              depth = 0
              quote = None
              escape = False
              in_comment = False
              i = open_index
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if in_comment:
                      if ch == '*' and nxt == '/':
                          in_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '*':
                      in_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def remove_legacy_sidebar_rules(text: str, filename: str) -> str:
              if filename == 'sidebars.css':
                  return text

              result = []
              i = 0
              while i < len(text):
                  open_index = text.find('{', i)
                  if open_index == -1:
                      result.append(text[i:])
                      break

                  boundary = max(
                      text.rfind('}', i, open_index),
                      text.rfind(';', i, open_index),
                      text.rfind('\n', i, open_index),
                  )
                  header_start = boundary + 1
                  prefix = text[i:header_start]
                  header = text[header_start:open_index].strip()
                  close_index = find_matching_brace(text, open_index)
                  if close_index == -1:
                      result.append(text[i:])
                      break

                  is_at_rule = header.startswith('@')
                  is_legacy = (
                      not is_at_rule
                      and any(marker in header for marker in LEGACY_SELECTOR_MARKERS)
                  )

                  result.append(prefix)
                  if not is_legacy:
                      result.append(text[header_start:close_index + 1])
                  i = close_index + 1

              return ''.join(result)

          def clean_file(path: Path):
              original = path.read_text(encoding='utf-8')

              # First repair catches already-expanded malformed declarations.
              text = repair_invalid_period_terminators(original)
              text = beautify_css(text)

              # Second repair catches malformed declarations that were hidden inside
              # compressed one-line legacy blocks before the first formatting pass.
              text = repair_invalid_period_terminators(text)
              text = beautify_css(text)

              # Remove only top-level rules that target retired sidebar systems.
              # Current role sidebar ownership remains exclusively in sidebars.css.
              text = remove_legacy_sidebar_rules(text, path.name)
              text = beautify_css(text)
              text = repair_invalid_period_terminators(text)
              text = beautify_css(text)

              if path.name == 'supervisor.css':
                  target = (
                      '.supervisor-class-meta {\n'
                      '    display: flex;\n'
                      '    flex-direction: column;\n'
                      '    gap: 14px;\n'
                      '    margin-top: 26px;\n'
                  )
                  replacement = target + '    margin-bottom: 12px;\n'
                  start = text.find(target)
                  if start != -1 and 'margin-bottom: 12px;' not in text[start:start + 240]:
                      text = text.replace(target, replacement, 1)

              path.write_text(text, encoding='utf-8', newline='\n')

          for css_file in FILES:
              clean_file(css_file)

          for css_file in FILES:
              text = css_file.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced braces after cleanup: {css_file}')
              malformed = re.findall(
                  r'^\s*(?:--[\w-]+|[A-Za-z_-][\w-]*)\s*:\s*.+\.\s*$',
                  text,
                  re.MULTILINE,
              )
              if malformed:
                  raise SystemExit(
                      f'Malformed declaration terminator remains in {css_file}: {malformed[:3]}'
                  )

          expected = sorted(p.name for p in FILES)
          actual = sorted(p.name for p in CSS_DIR.glob('*.css'))
          if actual != expected:
              raise SystemExit(f'Unexpected CSS file set: {actual}')

          print('Validated CSS files:', ', '.join(expected))
          PY

      - name: Commit CSS cleanup and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Kei Shiro"
          git config user.email "143948907+KeiShirogane1@users.noreply.github.com"
          git rm -f .github/workflows/temporary-css-cleanup.yml
          git rm -f .github/workflows/temporary-css-cleanup-v2.yml
          git add resources/assets/css/admin.css \
                  resources/assets/css/modals.css \
                  resources/assets/css/sidebars.css \
                  resources/assets/css/student.css \
                  resources/assets/css/style.css \
                  resources/assets/css/supervisor.css
          git diff --cached --check
          git commit -m "Clean and normalize CSS structure"
          git push origin HEAD:main
