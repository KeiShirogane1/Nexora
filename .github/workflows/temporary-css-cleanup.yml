name: One-time CSS cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[css-cleanup-trigger]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize CSS safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CSS_DIR = Path('resources/assets/css')
          FILES = [
              CSS_DIR / 'admin.css',
              CSS_DIR / 'modals.css',
              CSS_DIR / 'sidebars.css',
              CSS_DIR / 'student.css',
              CSS_DIR / 'style.css',
              CSS_DIR / 'supervisor.css',
          ]

          LEGACY_SELECTOR_MARKERS = (
              '.admin-sidebar',
              '.supervisor-sidebar',
              '.student-sidebar',
              '.nx-student-shell',
              '.nx-sidebar',
              '.nx-collapse-toggle',
              'body.supervisor-dashboard-page .sidebar-',
              'body.supervisor-dashboard-page .nav-icon',
          )

          def repair_invalid_period_terminators(text: str) -> str:
              # A legacy generated Student dashboard block used a period where a
              # declaration semicolon should be. Only repair declaration-shaped
              # lines that end in a literal period.
              fixed = []
              for line in text.replace('\r\n', '\n').replace('\r', '\n').split('\n'):
                  stripped = line.strip()
                  if re.match(r'^--?[A-Za-z_][\w-]*\s*:\s*.+\.$', stripped):
                      line = line[: line.rfind('.')] + ';' + line[line.rfind('.') + 1 :]
                  fixed.append(line)
              return '\n'.join(fixed)

          def beautify_css(text: str) -> str:
              lines = []
              current = []
              indent = 0
              paren_depth = 0
              quote = None
              escape = False
              i = 0

              def current_text():
                  return ''.join(current).strip()

              def normalize_piece(piece: str) -> str:
                  piece = re.sub(r'[ \t\n]+', ' ', piece.strip())
                  if re.match(r'^(--[\w-]+|[A-Za-z_-][\w-]*)\s*:', piece):
                      piece = re.sub(r'^([^:]+):\s*', lambda m: m.group(1).strip() + ': ', piece, count=1)
                  return piece

              def flush(extra=''):
                  nonlocal current
                  piece = normalize_piece(current_text())
                  if piece or extra:
                      value = (piece + extra).strip()
                      if value:
                          lines.append('    ' * indent + value)
                  current = []

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''

                  if quote:
                      current.append(ch)
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      current.append(ch)
                      i += 1
                      continue

                  if ch == '/' and nxt == '*':
                      flush()
                      end = text.find('*/', i + 2)
                      if end == -1:
                          comment = text[i:]
                          i = len(text)
                      else:
                          comment = text[i:end + 2]
                          i = end + 2
                      comment_lines = comment.splitlines()
                      if len(comment_lines) == 1:
                          lines.append('    ' * indent + comment_lines[0].strip())
                      else:
                          for raw in comment_lines:
                              lines.append('    ' * indent + raw.strip())
                      continue

                  if ch == '(':
                      paren_depth += 1
                      current.append(ch)
                      i += 1
                      continue
                  if ch == ')':
                      paren_depth = max(0, paren_depth - 1)
                      current.append(ch)
                      i += 1
                      continue

                  if paren_depth == 0 and ch == '{':
                      flush(' {')
                      indent += 1
                      i += 1
                      continue

                  if paren_depth == 0 and ch == '}':
                      flush()
                      indent = max(0, indent - 1)
                      lines.append('    ' * indent + '}')
                      i += 1
                      continue

                  if paren_depth == 0 and ch == ';':
                      current.append(';')
                      flush()
                      i += 1
                      continue

                  if ch.isspace():
                      if current and not current[-1].isspace():
                          current.append(' ')
                      i += 1
                      continue

                  current.append(ch)
                  i += 1

              flush()

              # Remove excessive vertical space while preserving section comments.
              out = []
              for line in lines:
                  if not line.strip():
                      if out and out[-1].strip():
                          out.append('')
                      continue
                  out.append(line.rstrip())
              return '\n'.join(out).strip() + '\n'

          def find_matching_brace(text: str, open_index: int) -> int:
              depth = 0
              quote = None
              escape = False
              in_comment = False
              i = open_index
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if in_comment:
                      if ch == '*' and nxt == '/':
                          in_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '*':
                      in_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def remove_legacy_sidebar_rules(text: str, filename: str) -> str:
              if filename == 'sidebars.css':
                  return text

              # Work on beautified CSS where each rule header is separated cleanly.
              result = []
              i = 0
              while i < len(text):
                  open_index = text.find('{', i)
                  if open_index == -1:
                      result.append(text[i:])
                      break

                  # Find the beginning of this header after the prior rule boundary.
                  boundary = max(text.rfind('}', i, open_index), text.rfind(';', i, open_index), text.rfind('\n', i, open_index))
                  header_start = boundary + 1
                  prefix = text[i:header_start]
                  header = text[header_start:open_index].strip()
                  close_index = find_matching_brace(text, open_index)
                  if close_index == -1:
                      result.append(text[i:])
                      break

                  is_at_rule = header.startswith('@')
                  is_legacy = (not is_at_rule) and any(marker in header for marker in LEGACY_SELECTOR_MARKERS)

                  result.append(prefix)
                  if is_legacy:
                      # Drop only the obsolete qualified rule. Current shared role
                      # sidebar selectors all live in sidebars.css as .nx-role-*.
                      i = close_index + 1
                      continue

                  # Preserve the rule exactly. Nested legacy rules inside @media are
                  # handled on a second pass below.
                  result.append(text[header_start:close_index + 1])
                  i = close_index + 1

              cleaned = ''.join(result)

              # Repeat until stable so legacy qualified rules nested in @media blocks
              # are removed after their parent block survives the first pass.
              if cleaned != text:
                  return remove_legacy_sidebar_rules(cleaned, filename)
              return cleaned

          def clean_file(path: Path):
              original = path.read_text(encoding='utf-8')
              text = repair_invalid_period_terminators(original)
              text = beautify_css(text)

              # Legacy sidebar pruning is deliberately limited to selectors from the
              # retired role sidebar systems. sidebars.css remains the sole owner.
              text = remove_legacy_sidebar_rules(text, path.name)
              text = beautify_css(text)

              # Small requested Supervisor Classes spacing repair: keep Open Class
              # aligned at the bottom while guaranteeing breathing room below Copy.
              if path.name == 'supervisor.css':
                  target = (
                      '.supervisor-class-meta {\n'
                      '    display: flex;\n'
                      '    flex-direction: column;\n'
                      '    gap: 14px;\n'
                      '    margin-top: 26px;\n'
                  )
                  replacement = target + '    margin-bottom: 12px;\n'
                  if target in text and 'margin-bottom: 12px;' not in text[text.find(target):text.find(target) + 220]:
                      text = text.replace(target, replacement, 1)

              path.write_text(text, encoding='utf-8', newline='\n')

          for css_file in FILES:
              clean_file(css_file)

          # Structural sanity checks.
          for css_file in FILES:
              text = css_file.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced braces after cleanup: {css_file}')
              if re.search(r'^\s*[-A-Za-z_][\w-]*\s*:\s*.+\.\s*$', text, re.MULTILINE):
                  raise SystemExit(f'Malformed declaration terminator remains: {css_file}')

          # The global sidebar stylesheet must remain the only CSS file containing
          # retired role sidebar selectors.
          for css_file in FILES:
              if css_file.name == 'sidebars.css':
                  continue
              text = css_file.read_text(encoding='utf-8')
              leftovers = [m for m in LEGACY_SELECTOR_MARKERS if m in text]
              if leftovers:
                  print(f'Note: legacy marker text remains in comments/non-rule context in {css_file.name}: {leftovers}')

          print('CSS cleanup completed for:', ', '.join(p.name for p in FILES))
          PY

      - name: Commit CSS cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Kei Shiro"
          git config user.email "143948907+KeiShirogane1@users.noreply.github.com"
          git rm .github/workflows/temporary-css-cleanup.yml
          git add resources/assets/css/admin.css \
                  resources/assets/css/modals.css \
                  resources/assets/css/sidebars.css \
                  resources/assets/css/student.css \
                  resources/assets/css/style.css \
                  resources/assets/css/supervisor.css
          git diff --cached --check
          git commit -m "Clean and normalize CSS structure"
          git push origin HEAD:main
