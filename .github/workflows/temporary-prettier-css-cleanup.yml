name: One-time Prettier CSS cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-css:
    if: contains(github.event.head_commit.message, '[css-prettier-cleanup]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format and validate CSS with Prettier
        shell: bash
        run: |
          npx --yes prettier@3.6.2 --write \
            resources/assets/css/admin.css \
            resources/assets/css/modals.css \
            resources/assets/css/sidebars.css \
            resources/assets/css/student.css \
            resources/assets/css/style.css \
            resources/assets/css/supervisor.css

          npx --yes prettier@3.6.2 --check \
            resources/assets/css/admin.css \
            resources/assets/css/modals.css \
            resources/assets/css/sidebars.css \
            resources/assets/css/student.css \
            resources/assets/css/style.css \
            resources/assets/css/supervisor.css

          test "$(find resources/assets/css -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort | tr '\n' ' ')" = "admin.css modals.css sidebars.css student.css style.css supervisor.css "
          git diff --check

      - name: Commit formatted CSS and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Kei Shiro"
          git config user.email "143948907+KeiShirogane1@users.noreply.github.com"

          git rm .github/workflows/temporary-prettier-css-cleanup.yml
          git add \
            resources/assets/css/admin.css \
            resources/assets/css/modals.css \
            resources/assets/css/sidebars.css \
            resources/assets/css/student.css \
            resources/assets/css/style.css \
            resources/assets/css/supervisor.css

          git diff --cached --check
          git commit -m "Format CSS with Prettier"
          git push origin HEAD:main
